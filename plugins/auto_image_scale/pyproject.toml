[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "udocket-auto-image-scale"
version = "0.1.0"
description = "MkDocs plugin that injects explicit width/height attributes based on intrinsic image sizes."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "uDocket Team" }]
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "pillow>=10.0.0,<11.0.0",
]

[project.entry-points."mkdocs.plugins"]
auto-image-scale = "auto_image_scale.plugin:AutoImageScalePlugin"

[tool.setuptools.packages.find]
where = ["src"]
