{% extends "_base.html" %}
{% block content %}
<div class="flex items-baseline justify-between">
  <h2 class="text-2xl font-semibold">Dashboard</h2>
  <a href="/admin/cases/new" class="inline-flex items-center gap-2 px-3 py-2 rounded-md bg-brand-600 text-white hover:bg-brand-700">
    <i class="ph ph-plus"></i>
    New Case
  </a>
  </div>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-6">
  <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4">
    <div class="text-slate-500 text-sm">Total Cases</div>
    <div class="text-3xl font-semibold mt-1">{{ cases_count }}</div>
  </div>
  <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4">
    <div class="text-slate-500 text-sm">Pending Jobs</div>
    <div class="text-3xl font-semibold mt-1">{{ jobs_pending }}</div>
  </div>
  <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4">
    <div class="text-slate-500 text-sm">Running Jobs</div>
    <div class="text-3xl font-semibold mt-1">{{ jobs_running }}</div>
  </div>
  <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4">
    <div class="text-slate-500 text-sm">Succeeded</div>
    <div class="text-3xl font-semibold mt-1">{{ jobs_done }}</div>
  </div>
</div>

<div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-6 mt-6">
  <div class="text-slate-500 text-sm">Failures</div>
  <div class="mt-2 flex items-center gap-2">
    <i class="ph ph-warning text-amber-500"></i>
    <span class="text-lg">{{ jobs_failed }}</span>
  </div>
  <a href="/admin/cases" class="inline-flex items-center gap-2 mt-4 text-brand-700 hover:text-brand-800 dark:text-brand-400">
    <i class="ph ph-arrow-right"></i>
    Go to Cases
  </a>
  </div>
{% endblock %}
