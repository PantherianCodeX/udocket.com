{% extends "_base.html" %}
{% block content %}
<h2 class="text-2xl font-semibold">Upload Audio</h2>
<form action="/admin/cases/{{ case_id }}/upload-audio" method="post" enctype="multipart/form-data" class="mt-6 space-y-4 max-w-xl">
  <div>
    <input type="file" name="file" required class="block w-full text-sm text-slate-600 dark:text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border file:border-slate-300 dark:file:border-slate-700 file:text-sm file:font-medium file:bg-white dark:file:bg-slate-900 file:text-slate-700 dark:file:text-slate-200 hover:file:bg-slate-50 dark:hover:file:bg-slate-800/80" />
  </div>
  <div class="grid grid-cols-2 gap-3">
    <div>
      <label for="transcription_mode" class="block text-sm text-slate-600 dark:text-slate-300">Transcription</label>
      <select name="transcription_mode" id="transcription_mode" class="mt-1 w-full rounded-md border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 focus:border-brand-500 focus:ring-brand-500">
        <option value="batch" selected>Batch</option>
        <option value="on-demand">On-demand</option>
      </select>
    </div>
    <div class="flex items-end">
      <label class="inline-flex items-center gap-2 text-sm">
        <input type="checkbox" name="diarization" id="diarization" class="rounded border-slate-300 text-brand-600 focus:ring-brand-500" />
        Enable diarization
      </label>
    </div>
  </div>
  <button type="submit" class="inline-flex items-center gap-2 px-4 py-2 rounded-md bg-brand-600 text-white hover:bg-brand-700">
    <i class="ph ph-cloud-arrow-up"></i>
    Upload
  </button>
  <script>
    const modeSel = document.getElementById('transcription_mode');
    const diarCb = document.getElementById('diarization');
    function toggleDiarization() {
      const isBatch = modeSel.value === 'batch';
      diarCb.disabled = !isBatch;
      if (!isBatch) diarCb.checked = false;
    }
    modeSel.addEventListener('change', toggleDiarization);
    toggleDiarization();
  </script>
</form>
{% endblock %}
