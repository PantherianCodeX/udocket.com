{% extends "_base.html" %}
{% block content %}
<div class="flex items-baseline justify-between">
  <h2 class="text-2xl font-semibold">Cases</h2>
  <a href="/admin/cases/new" class="inline-flex items-center gap-2 px-3 py-2 rounded-md bg-brand-600 text-white hover:bg-brand-700">
    <i class="ph ph-plus"></i>
    New Case
  </a>
</div>

<div class="mt-6 overflow-hidden rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
  <table class="min-w-full divide-y divide-slate-200 dark:divide-slate-800">
    <thead class="bg-slate-50 dark:bg-slate-800/40">
      <tr>
        <th class="px-4 py-3 text-left text-xs font-medium uppercase tracking-wider text-slate-500">Title</th>
        <th class="px-4 py-3 text-left text-xs font-medium uppercase tracking-wider text-slate-500">Reference</th>
        <th class="px-4 py-3 text-left text-xs font-medium uppercase tracking-wider text-slate-500">Created</th>
        <th class="px-4 py-3"></th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-200 dark:divide-slate-800">
      {% for c in cases %}
      <tr class="hover:bg-slate-50/60 dark:hover:bg-slate-800/50">
        <td class="px-4 py-3 font-medium">{{ c.title }}</td>
        <td class="px-4 py-3">{{ c.reference or "" }}</td>
        <td class="px-4 py-3 text-slate-500">{{ c.created_at }}</td>
        <td class="px-4 py-3 text-right">
          <a href="/admin/cases/{{ c.id }}" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-md border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">
            <i class="ph ph-folder-open"></i>
            Open
          </a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
