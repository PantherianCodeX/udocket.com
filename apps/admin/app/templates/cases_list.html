{% extends "_base.html" %}
{% block content %}
<div class="flex items-baseline justify-between">
  <h2 class="text-2xl font-semibold">Cases</h2>
  <a href="/admin/cases/new" class="inline-flex items-center gap-2 px-3 py-2 rounded-md bg-brand-600 text-white hover:bg-brand-700">
    <i class="ph ph-plus"></i>
    New Case
  </a>
  </div>

<div class="mt-6 overflow-hidden rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
  <table class="min-w-full divide-y divide-slate-200 dark:divide-slate-800" id="cases-table">
    <thead class="bg-slate-50 dark:bg-slate-800/40">
      <tr>
        <th class="px-4 py-3 text-left text-xs font-medium uppercase tracking-wider text-slate-500">Title</th>
        <th class="px-4 py-3 text-left text-xs font-medium uppercase tracking-wider text-slate-500">Reference</th>
        <th class="px-4 py-3 text-left text-xs font-medium uppercase tracking-wider text-slate-500">Created</th>
        <th class="px-4 py-3"></th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-200 dark:divide-slate-800" id="cases-tbody">
      {% for c in cases %}
      <tr class="group cursor-pointer hover:bg-slate-50/60 dark:hover:bg-slate-800/50"
          data-case-id="{{ c.id }}"
          data-title="{{ c.title|e }}"
          data-reference="{{ (c.reference or '')|e }}"
          data-party1="{{ (c.party_1 or '')|e }}"
          data-party2="{{ (c.party_2 or '')|e }}"
          data-client-role="{{ ((c.client_role|capitalize) if c.client_role else '')|e }}"
          data-created-at="{{ c.created_at.isoformat() if c.created_at else '' }}">
        <td class="px-4 py-3 font-medium flex items-center gap-2">
          <span class="inline-flex h-5 w-5 items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500"><i class="ph ph-folder"></i></span>
          {{ c.title }}
        </td>
        <td class="px-4 py-3">{{ c.reference or "" }}</td>
        <td class="px-4 py-3 text-slate-500">{{ c.created_at }}</td>
        <td class="px-4 py-3 text-right">
          <div class="inline-flex items-center gap-2">
            <a href="/admin/cases/{{ c.id }}" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-md bg-brand-600 text-white hover:bg-brand-700" onclick="event.stopPropagation();">
              <i class="ph ph-folder-open"></i>
              Open
            </a>
            <a href="/admin/cases/{{ c.id }}/edit" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-md border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800" onclick="event.stopPropagation();">
              <i class="ph ph-pencil-simple"></i>
              Edit
            </a>
          </div>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<script>
  const tbody = document.getElementById('cases-tbody');
  let openCaseId = null;

  function badge(label, cls) {
    return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium ${cls}">${label}</span>`;
  }

  function statusBadges(stats) {
    const bits = [];
    bits.push(badge(`${stats.succeeded} Succeeded`, 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-300'));
    if (stats.failed > 0) bits.push(badge(`${stats.failed} Failed`, 'bg-rose-100 text-rose-800 dark:bg-rose-900/40 dark:text-rose-300'));
    if (stats.running > 0) bits.push(badge(`${stats.running} Running`, 'bg-blue-100 text-blue-800 dark:bg-blue-900/40 dark:text-blue-300'));
    if (stats.pending > 0) bits.push(badge(`${stats.pending} Pending`, 'bg-slate-100 text-slate-800 dark:bg-slate-800 dark:text-slate-200'));
    return bits.join('\n');
  }

  function fmtFull(iso) {
    if (!iso) return '-';
    try { return new Date(iso).toLocaleString(); } catch { return iso; }
  }

  function detailsSkeleton(row) {
    const cid = row.getAttribute('data-case-id');
    const title = row.getAttribute('data-title') || '';
    const reference = row.getAttribute('data-reference') || '-';
    const party1 = row.getAttribute('data-party1') || '-';
    const party2 = row.getAttribute('data-party2') || '-';
    const clientRole = row.getAttribute('data-client-role') || '-';
    const createdAt = row.getAttribute('data-created-at') || '';
    return `
      <tr class="case-details-row bg-slate-50/50 dark:bg-slate-800/30">
        <td colspan="4" class="px-4 py-4">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-sm">
            <div>
              <div class="text-slate-500">Reference</div>
              <div class="font-medium">${reference || '-'}</div>
              <div class="mt-3 text-slate-500">Client Is</div>
              <div class="font-medium">${clientRole || '-'}</div>
            </div>
            <div>
              <div class="text-slate-500">Parties</div>
              <div class="font-medium">${party1 || '-'} vs ${party2 || '-'}</div>
            </div>
            <div>
              <div class="text-slate-500">Created</div>
              <div class="font-medium">${fmtFull(createdAt)}</div>
            </div>
          </div>
          <div class="mt-4 p-3 rounded-lg border border-slate-200 dark:border-slate-700" data-case-summary>
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <div class="text-slate-500 text-sm">Transcriptions</div>
                <div class="mt-1 text-sm text-slate-600 dark:text-slate-300">Loading summary…</div>
              </div>
              <div class="animate-pulse text-slate-400 text-sm">Fetching…</div>
            </div>
          </div>
        </td>
      </tr>
    `;
  }

  function summaryHTML(stats) {
    const lastUpd = stats.lastUpdate || null;
    return `
      <div class="flex items-start justify-between">
        <div>
          <div class="text-sm text-slate-500">Transcriptions</div>
          <div class="mt-1 flex flex-wrap items-center gap-2">
            ${statusBadges(stats)}
          </div>
        </div>
        <div class="text-right text-sm text-slate-500">
          <div>Updated</div>
          <div class="font-medium">${fmtFull(lastUpd)}</div>
        </div>
      </div>
      ${stats.total === 0 ? '<div class="mt-3 text-sm text-slate-500">No transcriptions yet. Upload audio from the case page.</div>' : ''}
    `;
  }

  function computeStats(jobs) {
    const s = { total: 0, succeeded: 0, failed: 0, running: 0, pending: 0, lastUpdate: null };
    if (!Array.isArray(jobs)) return s;
    s.total = jobs.length;
    for (const j of jobs) {
      if (j.status === 'SUCCEEDED') s.succeeded++;
      else if (j.status === 'FAILED') s.failed++;
      else if (j.status === 'RUNNING') s.running++;
      else s.pending++;
      const t = j.finished_at || j.started_at || j.created_at || null;
      if (t && (!s.lastUpdate || (new Date(t) > new Date(s.lastUpdate)))) s.lastUpdate = t;
    }
    return s;
  }

  function closeOpen() {
    const open = tbody.querySelector('.case-details-row');
    if (open) open.remove();
    openCaseId = null;
  }

  function clickRow(ev) {
    const row = ev.currentTarget;
    const cid = row.getAttribute('data-case-id');
    if (openCaseId === cid) { closeOpen(); return; }
    closeOpen();
    // Insert skeleton
    row.insertAdjacentHTML('afterend', detailsSkeleton(row));
    openCaseId = cid;
    // Fetch jobs and update summary area
    fetch(`/admin/api/cases/${cid}/jobs`)
      .then(r => r.ok ? r.json() : Promise.reject(new Error('failed')))
      .then(items => {
        const stats = computeStats(items);
        const sk = row.nextElementSibling;
        if (sk && sk.classList.contains('case-details-row')) {
          const slot = sk.querySelector('[data-case-summary]');
          if (slot) slot.innerHTML = summaryHTML(stats);
        }
      })
      .catch(() => {
        const sk = row.nextElementSibling;
        if (sk && sk.classList.contains('case-details-row')) {
          const slot = sk.querySelector('[data-case-summary]');
          if (slot) slot.innerHTML = '<div class="text-sm text-rose-600 dark:text-rose-400">Failed to load summary.</div>';
        }
      });
  }

  // Bind row click handlers
  document.querySelectorAll('#cases-tbody > tr').forEach(tr => {
    tr.addEventListener('click', clickRow);
  });
</script>
{% endblock %}
