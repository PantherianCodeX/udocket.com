{% extends "_base.html" %}
{% block content %}
<h2>Cases</h2>
<p><a href="/admin/cases/new">+ New Case</a></p>
<table border="1" cellpadding="6">
  <tr><th>Title</th><th>Reference</th><th>Created</th><th></th></tr>
  {% for c in cases %}
  <tr>
    <td>{{ c.title }}</td>
    <td>{{ c.reference or "" }}</td>
    <td>{{ c.created_at }}</td>
    <td><a href="/admin/cases/{{ c.id }}">Open</a></td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
