{% extends "_base.html" %}
{% block content %}
<h2 class="text-2xl font-semibold">New Case</h2>
<form action="/admin/cases" method="post" class="mt-6 grid grid-cols-1 gap-4 max-w-2xl">
  <div>
    <label class="block text-sm font-medium text-slate-600 dark:text-slate-300">Title</label>
    <input name="title" value="{{ title|default('') }}" required class="mt-1 w-full rounded-md border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-sm focus:border-brand-500 focus:ring-brand-500" placeholder="e.g. Smith v. Jones" />
  </div>
  <div>
    <label class="block text-sm font-medium text-slate-600 dark:text-slate-300">Reference</label>
    <input name="reference" value="{{ reference|default('') }}" class="mt-1 w-full rounded-md border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-sm focus:border-brand-500 focus:ring-brand-500" placeholder="Internal reference (optional)" />
  </div>
  <div>
    <label class="block text-sm font-medium text-slate-600 dark:text-slate-300">Client Is</label>
    <select id="client_role" name="client_role" class="mt-1 w-full rounded-md border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 focus:border-brand-500 focus:ring-brand-500">
      <option value="plaintiff" {% if client_role|default('plaintiff') == 'plaintiff' %}selected{% endif %}>Plaintiff</option>
      <option value="defendant" {% if client_role|default('plaintiff') == 'defendant' %}selected{% endif %}>Defendant</option>
    </select>
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div>
      <label id="client_label" class="block text-sm font-medium text-slate-600 dark:text-slate-300">Client</label>
      <input name="party_1" value="{{ party_1|default('') }}" required class="mt-1 w-full rounded-md border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-sm focus:border-brand-500 focus:ring-brand-500" placeholder="Client name" />
    </div>
    <div>
      <label id="opposing_label" class="block text-sm font-medium text-slate-600 dark:text-slate-300">Opposing Party</label>
      <input name="party_2" value="{{ party_2|default('') }}" required class="mt-1 w-full rounded-md border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-sm focus:border-brand-500 focus:ring-brand-500" placeholder="Opposing party name" />
    </div>
  </div>
  <div>
    <label class="block text-sm font-medium text-slate-600 dark:text-slate-300">Notes</label>
    <textarea name="notes" rows="6" class="mt-1 w-full rounded-md border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-sm focus:border-brand-500 focus:ring-brand-500" placeholder="Any context or instructions...">{{ notes|default('') }}</textarea>
  </div>
  <div class="pt-2 flex items-center gap-2">
    <a href="/admin/cases" class="px-3 py-2 rounded-md border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">Cancel</a>
    <button type="submit" class="inline-flex items-center gap-2 px-4 py-2 rounded-md bg-brand-600 text-white hover:bg-brand-700">
      <i class="ph ph-check"></i>
      Create
    </button>
  </div>
  </form>
<script>
  guardUnsavedChanges('form[action="/admin/cases"]');
  (function() {
    const sel = document.getElementById('client_role');
    const opp = document.getElementById('opposing_label');
    function updateLabels() {
      const v = sel.value;
      opp.textContent = v === 'plaintiff' ? 'Defendant' : 'Plaintiff';
    }
    sel.addEventListener('change', updateLabels);
    updateLabels();
  })();
</script>
{% endblock %}
