{% load ui_display %}
{% with may_edit=allow_title_edit|default_if_none:True %}
<div id="job-title-wrapper-{{ job.id }}" data-job-title-wrapper data-case-id="{{ case.id }}" data-job-id="{{ job.id }}" class="flex flex-col gap-2">
  <div class="flex flex-wrap items-center gap-3">
    <h2 class="text-lg font-semibold text-white" data-job-title-display-text>{{ job_title }}</h2>
    {% if may_edit %}
      <button
        type="button"
        class="inline-flex items-center gap-1 rounded border border-white/20 bg-white/10 px-2 py-1 text-xs font-semibold text-slate-200 transition hover:border-primary-400 hover:text-white {% if title_edit %}hidden{% endif %}"
        data-edit-job-title
      >Edit</button>
    {% endif %}
  </div>
  {% if may_edit %}
    <form
      class="flex flex-wrap items-center gap-2 {% if not title_edit %}hidden{% endif %}"
      data-job-title-form
    >
      {% csrf_token %}
      <input type="text" name="title" value="{{ job_title }}" class="min-w-[12rem] flex-1 rounded-lg border border-white/10 bg-slate-900/60 px-3 py-1.5 text-sm text-white focus:border-primary-400 focus:outline-none" placeholder="Enter transcript title">
      <div class="flex items-center gap-2">
        <button type="submit" class="inline-flex items-center rounded-lg border border-primary-400/40 bg-primary-500/10 px-3 py-1.5 text-xs font-semibold text-primary-100 transition hover:bg-primary-500/25">Save</button>
        <button
          type="button"
          class="inline-flex items-center rounded-lg border border-white/20 bg-white/10 px-3 py-1.5 text-xs font-semibold text-slate-200 transition hover:border-primary-400 hover:text-white"
          data-cancel-job-title
        >Cancel</button>
      </div>
    </form>
  {% endif %}
  {% if title_error %}
    <p class="text-xs text-rose-300" data-job-title-error>{{ title_error }}</p>
  {% endif %}
</div>
{% endwith %}
