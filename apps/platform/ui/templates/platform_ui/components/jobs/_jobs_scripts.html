{% load static %}
<script src="{% static 'platform_ui/js/case_detail/helpers.js' %}"></script>
<script src="{% static 'platform_ui/js/case_detail/ui.js' %}"></script>
<script src="{% static 'platform_ui/js/case_detail/modals.js' %}"></script>
<script src="{% static 'platform_ui/js/case_detail/actions.js' %}"></script>
<script src="{% static 'platform_ui/js/jobs_table.js' %}"></script>
<script src="{% static 'platform_ui/js/job_stream.js' %}"></script>
<script>
(function () {
  const platformUI = (window.platformUI = window.platformUI || {});
  const jobsTableApi = platformUI.jobsTable;
  const jobStream = platformUI.jobStream || null;
  if (!jobsTableApi || typeof jobsTableApi.init !== 'function') {
    console.warn('platformUI.jobsTable.init is required for jobs table interactions');
    return;
  }

  const jobsTableController = jobsTableApi.init({
    root: document,
    loadDetail: async (jobId, container) => {
      const resp = await fetch(`/jobs/${jobId}/detail-panel/`, {
        headers: { 'HX-Request': 'true' },
        credentials: 'same-origin',
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const html = await resp.text();
      container.innerHTML = html;
    },
    detailRowSelector: (jobId) => `[data-job-detail="${jobId}"]`,
    detailContainerSelector: (jobId) => `[data-job-detail-container="${jobId}"]`,
    onCollapse: (row) => {
      if (!row) return;
      const chevron = row.querySelector('[data-job-chevron]');
      if (chevron) chevron.classList.remove('rotate-90');
    },
    onAfterExpand: (row) => {
      if (!row) return;
      const chevron = row.querySelector('[data-job-chevron]');
      if (chevron) chevron.classList.add('rotate-90');
    },
  });

  const statusUtils = platformUI.status || {};
  const renderStatusLabel = statusUtils.renderStatusLabel || (() => {});
  const TERMINAL_STATUSES = statusUtils.TERMINAL_STATUSES || ['SUCCEEDED', 'FAILED', 'CANCELLED', 'ERROR', 'CORRUPTED'];

  const FALLBACK_INTERVAL_MS = 5000;
  const fallbackJobs = new Set();
  let fallbackTimer = null;
  let fallbackInFlight = false;
  let streamStatus = 'idle';

  function ensureFallbackTimer() {
    if (fallbackTimer) return;
    fallbackTimer = setInterval(() => runFallbackPoll(), FALLBACK_INTERVAL_MS);
  }

  function stopFallbackTimer() {
    if (!fallbackTimer) return;
    clearInterval(fallbackTimer);
    fallbackTimer = null;
  }

  async function runFallbackPoll(explicitIds) {
    if (fallbackInFlight) return;
    const ids = explicitIds ? Array.from(new Set(explicitIds)) : Array.from(fallbackJobs);
    if (!ids.length) {
      stopFallbackTimer();
      return;
    }

    fallbackInFlight = true;
    try {
      const params = new URLSearchParams();
      params.set('ids', ids.join(','));
      const resp = await fetch(`/api/v1/jobs/status/bulk/?${params.toString()}`, { credentials: 'same-origin' });
      if (!resp.ok) {
        return;
      }
      const records = await resp.json();
      const seen = new Set();
      if (Array.isArray(records)) {
        records.forEach((item) => {
          const jobId = String(item.id || '').trim();
          if (!jobId) return;
          seen.add(jobId);
          applyJobPayload(jobId, item);
          const normalized = (item.status || '').toString().toUpperCase();
          if (normalized && TERMINAL_STATUSES.includes(normalized)) {
            clearFallback(jobId);
          }
        });
      }
      ids.forEach((jobId) => {
        if (!seen.has(jobId)) {
          clearFallback(jobId);
        }
      });
    } catch (error) {
      console.warn('jobs fallback poll failed', ids, error);
    } finally {
      fallbackInFlight = false;
      if (!fallbackJobs.size) {
        stopFallbackTimer();
      }
    }
  }

  function markFallback(jobId, immediate) {
    if (!jobId) return;
    const id = String(jobId);
    if (!fallbackJobs.has(id)) {
      fallbackJobs.add(id);
    }
    ensureFallbackTimer();
    if (immediate) runFallbackPoll([id]);
  }

  function clearFallback(jobId) {
    if (!jobId) return;
    const id = String(jobId);
    if (fallbackJobs.delete(id) && !fallbackJobs.size) {
      stopFallbackTimer();
    }
  }

  function applyJobPayload(jobId, payload) {
    const statusEl = document.getElementById(`job-status-${jobId}`);
    const transcriptEl = document.getElementById(`job-transcript-${jobId}`);
    const status = payload.status || payload.event || '';
    const normalized = statusUtils.normalizeStatus ? statusUtils.normalizeStatus(status) : (status || '').toString().toUpperCase();
    const progress = payload.progress_percent ?? payload.upload_progress;

    if (statusEl) {
      renderStatusLabel(statusEl, normalized, progress);
      statusEl.dataset.status = normalized;
    }
    if (transcriptEl && (payload.transcript_file || payload.transcript_path || normalized === 'SUCCEEDED')) {
      transcriptEl.innerHTML = `<a class="font-medium text-primary-300 underline" href="/api/v1/jobs/${payload.job_id || jobId}/download/">Download</a>`;
    }
    if (normalized && TERMINAL_STATUSES.includes(normalized)) {
      clearFallback(jobId);
    }
  }

  function currentJobIds() {
    return Array.from(document.querySelectorAll('[data-job]')).map((row) => row.dataset.job).filter(Boolean);
  }

  function bootstrapJobs() {
    const jobIds = currentJobIds();
    if (jobStream && typeof jobStream.setJobsForSource === 'function') {
      jobStream.setJobsForSource('jobs-page', jobIds);
    }
    const visible = new Set(jobIds.map((id) => String(id)));
    Array.from(fallbackJobs).forEach((jobId) => {
      if (!visible.has(jobId)) {
        fallbackJobs.delete(jobId);
      }
    });
    if (!fallbackJobs.size) stopFallbackTimer();
    jobIds.forEach((jobId) => {
      const statusEl = document.getElementById(`job-status-${jobId}`);
      if (statusEl) {
        const statusValue = statusEl.dataset && statusEl.dataset.status ? statusEl.dataset.status : statusEl.textContent;
        const progressValue = statusEl.dataset && statusEl.dataset.progress ? parseFloat(statusEl.dataset.progress) : undefined;
        renderStatusLabel(statusEl, statusValue, progressValue);
      }
      if (streamStatus !== 'connected') {
        markFallback(jobId, false);
      } else {
        clearFallback(jobId);
      }
    });
  }

  if (jobStream) {
    jobStream.onUpdate((payload) => {
      const jobId = String(payload.job_id || payload.id || '').trim();
      if (!jobId) return;
      applyJobPayload(jobId, payload);
    });

    jobStream.onStatus((status) => {
      streamStatus = status;
      const jobIds = currentJobIds();
      if (status === 'connected') {
        fallbackJobs.clear();
        stopFallbackTimer();
      } else {
        jobIds.forEach((jobId) => markFallback(jobId, false));
      }
    });
  }

  window.addEventListener('DOMContentLoaded', bootstrapJobs);

  window.addEventListener('beforeunload', () => {
    if (jobStream && typeof jobStream.removeJobSource === 'function') {
      jobStream.removeJobSource('jobs-page');
    }
    fallbackJobs.clear();
    stopFallbackTimer();
  });

  document.addEventListener('htmx:afterSwap', () => {
    jobsTableController.collapseAll();
    bootstrapJobs();
  });

  const closeJobMenus = () => {
    const popovers = platformUI.popovers;
    if (popovers && typeof popovers.closeAll === 'function') {
      popovers.closeAll('[data-job-action-menu][open]');
    }
  };

  document.addEventListener('click', (event) => {
    if (!event.target.closest('[data-job-action-menu]')) {
      closeJobMenus();
    }
  });
})();
</script>
