{% load static %}
<script src="{% static 'platform_ui/js/case_detail/helpers.js' %}"></script>
<script src="{% static 'platform_ui/js/case_detail/ui.js' %}"></script>
<script src="{% static 'platform_ui/js/case_detail/modals.js' %}"></script>
<script src="{% static 'platform_ui/js/case_detail/actions.js' %}"></script>
<script src="{% static 'platform_ui/js/case_detail/realtime.js' %}"></script>
<script src="{% static 'platform_ui/js/jobs_table.js' %}"></script>
<script>
(function () {
  const platformUI = (window.platformUI = window.platformUI || {});
  const jobsTableApi = platformUI.jobsTable;
  if (!jobsTableApi || typeof jobsTableApi.init !== 'function') {
    console.warn('platformUI.jobsTable.init is required for jobs table interactions');
    return;
  }

  const caseDetail = (platformUI.caseDetail = platformUI.caseDetail || {});
  caseDetail.helpers = caseDetail.helpers || {};

  const modalRoot = document.getElementById('modal-root');
  const notify = (x, y, text) => {
    if (typeof platformUI.toastAt === 'function') {
      platformUI.toastAt(x, y, text);
    } else if (typeof platformUI.toast === 'function') {
      platformUI.toast(text);
    }
  };

  const ctx = {
    global: window,
    caseView: document,
    caseId: null,
    initialToolKey: '',
    workspace: null,
    modalRoot,
    jobsState: {
      currentCaseId: null,
      pollers: {},
      sockets: {},
      lastStatus: {},
      refreshTranscribeScheduled: false,
      fallbackJobs: new Set(),
      connectTimeouts: {},
      fallbackTimer: null,
      fallbackInFlight: false,
    },
    jobsTableApi,
    statusUtils: platformUI.status || {},
    jobActions: platformUI.jobActions || {},
    modalApi: platformUI.modal || {},
    toastAt: typeof platformUI.toastAt === 'function' ? platformUI.toastAt : null,
    toast: typeof platformUI.toast === 'function' ? platformUI.toast : null,
  };

  caseDetail.ui?.setContext?.(ctx);
  caseDetail.realtime?.setContext?.(ctx);
  caseDetail.modals?.setContext?.({ modalRoot, modalApi: ctx.modalApi });
  caseDetail.modals?.setNotify?.(notify);
  caseDetail.actions?.setContext?.(ctx);

  caseDetail.ui?.setDeps?.({
    helpers: caseDetail.helpers,
    realtime: caseDetail.realtime,
    notify,
    actions: caseDetail.actions,
    onTranscribeRefresh: () => {},
  });
  caseDetail.realtime?.setDeps?.({
    ui: caseDetail.ui,
    scheduleTranscribeRefresh: () => {},
  });
  caseDetail.actions?.setDeps?.({
    helpers: caseDetail.helpers,
    ui: caseDetail.ui,
    realtime: caseDetail.realtime,
    modals: caseDetail.modals,
    notify,
  });

  const jobsTableController = jobsTableApi.init({
    root: document,
    loadDetail: async (jobId, container) => {
      const resp = await fetch(`/jobs/${jobId}/detail-panel/`, {
        headers: { 'HX-Request': 'true' },
        credentials: 'same-origin',
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const html = await resp.text();
      container.innerHTML = html;
      if (window.htmx && typeof window.htmx.process === 'function') {
        window.htmx.process(container);
      }
    },
    detailRowSelector: (jobId) => `[data-job-detail="${jobId}"]`,
    detailContainerSelector: (jobId) => `[data-job-detail-container="${jobId}"]`,
    onCollapse: (row) => {
      if (!row) return;
      row.setAttribute('aria-expanded', 'false');
      const chevron = row.querySelector('[data-job-chevron]');
      if (chevron) chevron.classList.remove('rotate-90');
    },
    onAfterExpand: (row) => {
      if (!row) return;
      row.setAttribute('aria-expanded', 'true');
      const chevron = row.querySelector('[data-job-chevron]');
      if (chevron) chevron.classList.add('rotate-90');
    },
  });

  const closeJobMenus = () => {
    document.querySelectorAll('[data-job-action-menu][open]').forEach((menu) => menu.removeAttribute('open'));
  };

  document.addEventListener('pointerdown', (evt) => {
    const summary = evt.target.closest('[data-job-action-menu] > summary');
    if (summary) {
      const owner = summary.parentElement;
      document.querySelectorAll('[data-job-action-menu][open]').forEach((menu) => {
        if (menu !== owner) menu.removeAttribute('open');
      });
      return;
    }
    if (!evt.target.closest('[data-job-action-menu]')) {
      closeJobMenus();
    }
  });

  document.addEventListener('keydown', (evt) => {
    if (evt.key === 'Escape') closeJobMenus();
  });

  document.addEventListener('click', (evt) => {
    const item = evt.target.closest('[data-job-action-item]');
    if (!item) return;
    const popovers = platformUI.popovers;
    if (popovers && typeof popovers.closeAll === 'function') {
      popovers.closeAll();
    }
  });

  if (caseDetail.actions && !window.__jobsActionsBound) {
    document.addEventListener('click', caseDetail.actions.handleJobAction, true);
    document.addEventListener('click', caseDetail.actions.handleJobNotesSave, true);
    window.__jobsActionsBound = true;
  }

  function hydrateJobs() {
    document.querySelectorAll('[data-job]').forEach((row) => {
      const jobId = row.dataset.job;
      if (!jobId) return;
      caseDetail.realtime?.watchJob?.(jobId);

      const statusEl = document.getElementById(`job-status-${jobId}`);
      if (statusEl && caseDetail.ui?.updateStatusDisplays) {
        const statusValue = statusEl.dataset?.status || statusEl.textContent || '';
        const progressValue = statusEl.dataset?.progress ? parseFloat(statusEl.dataset.progress) : undefined;
        caseDetail.ui.updateStatusDisplays(jobId, statusValue, progressValue);
      }

      const indicator = row.querySelector('[data-job-notes-indicator]');
      if (indicator && caseDetail.ui?.updateNotesIndicator) {
        const count = parseInt(indicator.getAttribute('data-count') || '0', 10) || 0;
        caseDetail.ui.updateNotesIndicator(jobId, count);
      }
    });
  }

  window.addEventListener('DOMContentLoaded', hydrateJobs);
  document.addEventListener('htmx:afterSwap', (evt) => {
    if (evt.target && evt.target.matches('[data-table-body]')) {
      jobsTableController.collapseAll();
    }
    hydrateJobs();
  });
})();
</script>
