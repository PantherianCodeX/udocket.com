<script>
  (function () {
    const STATE_KEY = 'platformUITables';
    const COLUMN_STORAGE_SUFFIX = 'columns';

    function toSortField(field) {
      return field ? field.toString() : '';
    }

    function storageKey(table, suffix) {
      const key = table.dataset.tableKey || table.getAttribute('id') || 'table';
      return `${STATE_KEY}:${key}:${suffix}`;
    }

    function getGroups(table) {
      const body = table.querySelector('[data-table-body]');
      if (!body) return [];
      const parents = Array.from(body.querySelectorAll('[data-table-row][data-table-depth="0"]'));
      return parents.map((parent) => {
        const id = parent.getAttribute('data-table-row-id') || parent.dataset.job || parent.dataset.tableGroup || '';
        const rows = [parent];
        if (id) {
          const detail = body.querySelector(`[data-table-detail-for="${CSS.escape(id)}"]`);
          if (detail) rows.push(detail);
          const children = Array.from(body.querySelectorAll(`[data-table-row][data-table-parent-id="${CSS.escape(id)}"]`));
          children.forEach((child) => {
            rows.push(child);
            const childId = child.getAttribute('data-table-row-id') || child.dataset.job || '';
            if (childId) {
              const childDetail = body.querySelector(`[data-table-detail-for="${CSS.escape(childId)}"]`);
              if (childDetail) rows.push(childDetail);
            }
          });
        }
        return { id, rows, parent };
      });
    }

    function normalizeValue(value, direction) {
      if (value == null) return direction === 'desc' ? Number.NEGATIVE_INFINITY : Number.NEGATIVE_INFINITY;
      const num = Number(value);
      if (!Number.isNaN(num)) return num;
      return value.toString().toLowerCase();
    }

    function sortTable(table, field, direction) {
      const body = table.querySelector('[data-table-body]');
      if (!body) return;
      const groups = getGroups(table);
      const appliedDirection = direction === 'desc' ? 'desc' : 'asc';
      groups.sort((a, b) => {
        const aVal = normalizeValue(a.parent.getAttribute(`data-table-value-${field}`), appliedDirection);
        const bVal = normalizeValue(b.parent.getAttribute(`data-table-value-${field}`), appliedDirection);
        if (aVal < bVal) return appliedDirection === 'asc' ? -1 : 1;
        if (aVal > bVal) return appliedDirection === 'asc' ? 1 : -1;
        return 0;
      });
      groups.forEach((group) => {
        group.rows.forEach((row) => {
          if (row && row.parentNode === body) {
            body.appendChild(row);
          }
        });
      });
      table.setAttribute('data-table-sorted-field', field);
      table.setAttribute('data-table-sorted-direction', appliedDirection);
    }

    function resetSortIndicators(table, activeButton, direction) {
      table.querySelectorAll('[data-table-sort]').forEach((btn) => {
        const icon = btn.querySelector('[data-table-sort-icon]');
        if (btn === activeButton) {
          btn.setAttribute('data-table-direction', direction);
          btn.classList.add('text-white');
          if (icon) {
            icon.classList.remove('rotate-180');
            if (direction === 'desc') icon.classList.add('rotate-180');
            else icon.classList.remove('rotate-180');
          }
        } else {
          btn.removeAttribute('data-table-direction');
          btn.classList.remove('text-white');
          if (icon) icon.classList.remove('rotate-180');
        }
      });
    }

    function loadColumnState(table) {
      try {
        const stored = window.localStorage.getItem(storageKey(table, COLUMN_STORAGE_SUFFIX));
        if (!stored) return null;
        const parsed = JSON.parse(stored);
        return typeof parsed === 'object' && parsed ? parsed : null;
      } catch (_) {
        return null;
      }
    }

    function saveColumnState(table, state) {
      try {
        window.localStorage.setItem(
          storageKey(table, COLUMN_STORAGE_SUFFIX),
          JSON.stringify(state || {})
        );
      } catch (_) {
        /* ignore storage errors */
      }
    }

    function setColumnVisibility(table, columnId, visible) {
      if (!columnId) return;
      const display = visible !== false;
      const header = table.querySelector(`[data-table-column="${CSS.escape(columnId)}"]`);
      const cells = table.querySelectorAll(`[data-table-cell="${CSS.escape(columnId)}"]`);
      if (header) {
        header.classList[display ? 'remove' : 'add']('hidden');
      }
      cells.forEach((cell) => {
        cell.classList[display ? 'remove' : 'add']('hidden');
      });
    }

    function applyColumnState(table, state, container) {
      if (!state) return;
      Object.keys(state).forEach((columnId) => setColumnVisibility(table, columnId, state[columnId]));
      if (!container) return;
      container.querySelectorAll('[data-table-column-toggle]').forEach((input) => {
        const columnId = input.value;
        if (!columnId) return;
        const visible = state[columnId];
        input.checked = visible !== false;
      });
    }

    let dismissListenersBound = false;

    function bindDismissListeners() {
      if (dismissListenersBound) return;
      dismissListenersBound = true;
      document.addEventListener('click', (event) => {
        document
          .querySelectorAll('details[data-popover][open]')
          .forEach((details) => {
            if (!details.contains(event.target)) {
              details.removeAttribute('open');
            }
          });
      });
      document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') return;
        document
          .querySelectorAll('details[data-popover][open]')
          .forEach((details) => details.removeAttribute('open'));
      });
    }

    function resetTableFilters(container, paramNames) {
      if (!paramNames.length) return;
      try {
        const url = new URL(window.location.href);
        paramNames.forEach((name) => url.searchParams.delete(name));
        window.location.assign(url.pathname + (url.searchParams.toString() ? `?${url.searchParams.toString()}` : ''));
      } catch (_) {
        const [base] = window.location.href.split('?');
        window.location.assign(base);
      }
    }

    function syncFilterInputs(container, source) {
      if (!container || !source) return;
      const name = source.getAttribute('name');
      if (!name) return;
      const selector = `[data-table-filter-input][name="${CSS.escape(name)}"]`;
      const sourceValue = source.value;
      const sourceType = source.type;
      container.querySelectorAll(selector).forEach((input) => {
        if (input === source) return;
        if (sourceType === 'checkbox') {
          if (input.value === sourceValue) {
            input.checked = source.checked;
          }
        } else if (sourceType === 'radio') {
          input.checked = input.value === sourceValue;
        } else {
          input.value = source.value;
        }
      });
      updateFilterAnalyses(container, '');
    }

    function updateFilterAnalyses(container, paramName) {
      if (!container) return;
      const detailsNodes = container.querySelectorAll('details[data-table-filter-param]');
      detailsNodes.forEach((details) => {
        const detailsParam = details.getAttribute('data-table-filter-param');
        if (paramName && detailsParam && detailsParam !== paramName) {
          return;
        }
        const type = details.getAttribute('data-table-filter-type') || '';
        const summaryEl = details.querySelector('[data-table-filter-summary]');
        if (!summaryEl) return;
        let summaryText = summaryEl.dataset.defaultText || 'All';
        let hasValue = false;
        if (type === 'select') {
          const inputName = details.getAttribute('data-table-filter-param');
          if (inputName) {
            const labels = [];
            container.querySelectorAll(`[data-table-filter-input][name="${CSS.escape(inputName)}"]`).forEach((input) => {
              if (!input.checked) return;
              if (!input.value) return;
              const label = input.closest('label');
              if (label) {
                const text = label.textContent ? label.textContent.trim() : '';
                if (text) labels.push(text);
              }
            });
            if (labels.length) {
              summaryText = labels.slice(0, 3).join(', ');
              if (labels.length > 3) {
                summaryText += '…';
              }
              hasValue = true;
            }
          }
        } else if (type === 'daterange') {
          const startParam = details.getAttribute('data-table-filter-start');
          const endParam = details.getAttribute('data-table-filter-end');
          const startInput = startParam ? container.querySelector(`[data-table-filter-input][name="${CSS.escape(startParam)}"]`) : null;
          const endInput = endParam ? container.querySelector(`[data-table-filter-input][name="${CSS.escape(endParam)}"]`) : null;
          const startValue = startInput && startInput.value ? startInput.value : '';
          const endValue = endInput && endInput.value ? endInput.value : '';
          if (startValue || endValue) {
            summaryText = `${startValue || '—'} → ${endValue || '—'}`;
            hasValue = true;
          }
        }
        summaryEl.textContent = summaryText;
        summaryEl.classList.toggle('text-primary-200', hasValue);
        summaryEl.classList.toggle('text-slate-500', !hasValue);
      });
    }

    function bindTable(table) {
      if (table.dataset.tableReady === '1') return;
      const container = table.closest('[data-table-container]');
      const form = container ? container.querySelector('[data-table-filter-form]') : null;
      const pageInput = form ? form.querySelector('[data-table-page-input]') : null;
      const pageSizeSelect = form ? form.querySelector('[data-table-page-size]') : null;
      const applyButtons = container ? container.querySelectorAll('[data-table-apply]') : [];
      const resetButtons = container ? container.querySelectorAll('[data-table-reset]') : [];
      const columnPopover = container ? container.querySelector('details[data-popover="table-columns"]') : null;
      const filtersPopover = container ? container.querySelector('details[data-popover="table-filters"]') : null;
      const paginationWrappers = container ? container.querySelectorAll('[data-table-pagination-toolbar]') : [];
      const paramNames = (container?.dataset.tableParams || '')
        .split(',')
        .map((name) => name.trim())
        .filter(Boolean);

      const defaultColumnState = {};
      table.querySelectorAll('[data-table-column]').forEach((header) => {
        const columnId = header.getAttribute('data-table-column');
        if (!columnId) return;
        defaultColumnState[columnId] = header.getAttribute('data-table-column-hidden') === '1' ? false : true;
      });

      const savedColumnState = loadColumnState(table) || {};
      const columnState = Object.assign({}, defaultColumnState, savedColumnState);
      applyColumnState(table, columnState, container);

      table.querySelectorAll('[data-table-sort]').forEach((button) => {
        button.addEventListener('click', () => {
          const field = toSortField(button.getAttribute('data-table-sort-field') || button.dataset.tableSort);
          if (!field) return;
          const current = button.getAttribute('data-table-direction');
          const nextDirection = current === 'asc' ? 'desc' : 'asc';
          sortTable(table, field, nextDirection);
          resetSortIndicators(table, button, nextDirection);
        });
        const defaultDirection = button.getAttribute('data-table-sort-default');
        if (defaultDirection) {
          const field = toSortField(button.getAttribute('data-table-sort-field') || button.dataset.tableSort);
          sortTable(table, field, defaultDirection);
          resetSortIndicators(table, button, defaultDirection);
        }
      });

      bindDismissListeners();

      if (columnPopover) {
        columnPopover.querySelectorAll('[data-table-column-toggle]').forEach((input) => {
          const columnId = input.value;
          if (!columnId) return;
          input.addEventListener('change', () => {
            columnState[columnId] = input.checked;
            setColumnVisibility(table, columnId, input.checked);
            saveColumnState(table, columnState);
          });
        });
      }

      if (container) {
        container.querySelectorAll('[data-table-filter-input]').forEach((input) => {
          input.addEventListener('change', () => {
            syncFilterInputs(container, input);
            if (pageInput) pageInput.value = '1';
          });
        });
      }

      if (filtersPopover) {
        filtersPopover.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') {
            filtersPopover.removeAttribute('open');
          }
        });
      }

      if (container) {
        container.querySelectorAll('[data-table-filter-clear]').forEach((button) => {
          button.addEventListener('click', () => {
            const param = button.getAttribute('data-table-filter-clear');
            const group = button.closest('[data-table-filter-group]');
            if (!group || !param) return;
            group.querySelectorAll(`input[name="${CSS.escape(param)}"]`).forEach((input) => {
              if (input.type === 'checkbox') {
                input.checked = false;
              } else if (input.type === 'radio') {
                input.checked = input.value === '';
              }
              syncFilterInputs(container, input);
            });
            if (pageInput) pageInput.value = '1';
          });
        });
      }

      if (form) {
        form.addEventListener('submit', (event) => {
          const submitter = event.submitter;
          if (!pageInput) return;
          if (!submitter || submitter.hasAttribute('data-table-apply')) {
            pageInput.value = '1';
          }
        });
      }

      function submitPage(targetPage) {
        if (!form || !pageInput) return;
        if (!targetPage) return;
        pageInput.value = String(targetPage);
        form.submit();
      }

      paginationWrappers.forEach((wrapper) => {
        wrapper.querySelectorAll('[data-table-page-first]').forEach((button) => {
          button.addEventListener('click', () => {
            const value = button.getAttribute('data-table-page-first');
            submitPage(value);
          });
        });
        wrapper.querySelectorAll('[data-table-page-previous]').forEach((button) => {
          button.addEventListener('click', () => {
            const value = button.getAttribute('data-table-page-previous');
            submitPage(value);
          });
        });
        wrapper.querySelectorAll('[data-table-page-next]').forEach((button) => {
          button.addEventListener('click', () => {
            const value = button.getAttribute('data-table-page-next');
            submitPage(value);
          });
        });
        wrapper.querySelectorAll('[data-table-page-last]').forEach((button) => {
          button.addEventListener('click', () => {
            const value = button.getAttribute('data-table-page-last');
            submitPage(value);
          });
        });
        wrapper.querySelectorAll('[data-table-page-field]').forEach((inputField) => {
          const total = Number(inputField.getAttribute('data-table-page-total')) || 1;
          const current = Number(inputField.getAttribute('data-table-page-current')) || 1;
          let originalValue = inputField.value;

          function clamp(value) {
            const parsed = Number(value);
            if (Number.isNaN(parsed) || parsed < 1) return 1;
            if (parsed > total) return total;
            return parsed;
          }

          inputField.addEventListener('focus', () => {
            originalValue = inputField.value;
          });

          inputField.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
              event.preventDefault();
              const target = clamp(inputField.value);
              if (target !== current) {
                submitPage(target);
              } else {
                inputField.value = String(current);
                inputField.blur();
              }
            } else if (event.key === 'Escape') {
              inputField.value = originalValue;
              inputField.blur();
            }
          });

          inputField.addEventListener('blur', () => {
            const target = clamp(inputField.value);
            inputField.value = String(target);
            if (target !== current) {
              submitPage(target);
            }
          });
        });
      });

      if (pageSizeSelect && form && pageInput) {
        pageSizeSelect.addEventListener('change', () => {
          pageInput.value = '1';
          form.submit();
        });
      }

      resetButtons.forEach((button) => {
        button.addEventListener('click', (event) => {
          event.preventDefault();
          resetTableFilters(container, paramNames);
        });
      });

      applyButtons.forEach((button) => {
        button.addEventListener('click', () => {
          if (pageInput) pageInput.value = '1';
          if (form && typeof form.requestSubmit === 'function') {
            form.requestSubmit(button);
          } else if (form) {
            form.submit();
          }
          container?.querySelectorAll('details[data-popover][open]').forEach((details) => {
            details.removeAttribute('open');
          });
        });
      });

      updateFilterAnalyses(container, '');
      saveColumnState(table, columnState);
      table.dataset.tableReady = '1';
    }

    function initAll() {
      document.querySelectorAll('[data-table-container]').forEach((container) => {
        const table = container.querySelector('[data-table]');
        if (!table) return;
        container.dataset.tableParams = container.dataset.tableParams ||
          (container.getAttribute('data-table-params') || '');
        bindTable(table);
      });
    }

    if (!window[STATE_KEY]) {
      window[STATE_KEY] = { initAll };
      window.addEventListener('DOMContentLoaded', initAll);
      document.addEventListener('htmx:afterSwap', initAll);
    } else {
      window[STATE_KEY].initAll();
    }
  })();
</script>
