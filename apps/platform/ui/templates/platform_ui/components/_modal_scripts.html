<script>
(function() {
  if (window.udocketModal) return;

  const FOCUSABLE_SELECTORS = [
    'a[href]',
    'button:not([disabled])',
    'textarea:not([disabled])',
    'input:not([disabled]):not([type="hidden"])',
    'select:not([disabled])',
    '[tabindex]:not([tabindex="-1"])'
  ].join(',');

  const modalStack = [];

  function escapeHTML(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function lockBodyScroll() {
    if (modalStack.length === 1) {
      document.documentElement.classList.add('modal-open');
      document.body.classList.add('modal-open');
      const prev = document.body.style.overflow;
      modalStack._prevOverflow = prev;
      document.body.style.overflow = 'hidden';
    }
  }

  function unlockBodyScroll() {
    if (modalStack.length === 0) {
      document.documentElement.classList.remove('modal-open');
      document.body.classList.remove('modal-open');
      const prev = modalStack._prevOverflow;
      document.body.style.overflow = prev || '';
      delete modalStack._prevOverflow;
    }
  }

  function getFocusable(modal) {
    return Array.from(modal.querySelectorAll(FOCUSABLE_SELECTORS)).filter((el) => {
      if (!(el instanceof HTMLElement)) return false;
      if (el.offsetParent === null && el !== document.activeElement) return false;
      return true;
    });
  }

  function focusFirst(modal) {
    const dialog = modal.querySelector('[data-modal-dialog]');
    if (dialog instanceof HTMLElement) {
      dialog.focus({ preventScroll: true });
    }
    const focusable = getFocusable(modal);
    const target = focusable.find((el) => el.getAttribute('data-modal-auto-focus') === '1') || focusable[0];
    if (target && target !== document.activeElement) {
      target.focus({ preventScroll: true });
    }
  }

  function trapFocus(evt, modal) {
    if (evt.key !== 'Tab') return;
    const focusable = getFocusable(modal);
    if (!focusable.length) {
      evt.preventDefault();
      return;
    }
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    const active = document.activeElement;
    if (evt.shiftKey) {
      if (active === first || !modal.contains(active)) {
        evt.preventDefault();
        last.focus();
      }
    } else if (active === last) {
      evt.preventDefault();
      first.focus();
    }
  }

  function bindModal(modal, entry) {
    if (modal.dataset.modalBound === '1') return;
    modal.dataset.modalBound = '1';

    const keydownHandler = (evt) => {
      if (evt.key === 'Escape') {
        evt.preventDefault();
        udocketModal.close(modal, { reason: 'escape' });
      } else {
        trapFocus(evt, modal);
      }
    };
    const clickHandler = (evt) => {
      if (evt.target === modal) {
        udocketModal.close(modal, { reason: 'backdrop' });
      }
    };
    const closeHandler = (evt) => {
      evt.preventDefault();
      const target = evt.currentTarget;
      let reason = 'button';
      if (target instanceof HTMLElement) {
        const value = target.getAttribute('data-modal-close');
        if (value) reason = value;
      }
      udocketModal.close(modal, { reason });
    };

    modal.addEventListener('keydown', keydownHandler);
    modal.addEventListener('mousedown', clickHandler);
    modal.querySelectorAll('[data-modal-close]').forEach((btn) => {
      btn.addEventListener('click', closeHandler);
    });

    entry.cleanupHandlers = () => {
      modal.removeEventListener('keydown', keydownHandler);
      modal.removeEventListener('mousedown', clickHandler);
      modal.querySelectorAll('[data-modal-close]').forEach((btn) => {
        btn.removeEventListener('click', closeHandler);
      });
    };
  }

  function removeModalElement(entry) {
    const modal = entry.modal;
    if (modal && modal.isConnected && entry.removeOnClose !== false) {
      const parent = modal.parentElement;
      modal.remove();
      if (parent && parent.id === 'modal-root') {
        parent.innerHTML = '';
      }
    }
  }

  function restoreFocus(entry) {
    if (entry && entry.previousFocus && document.contains(entry.previousFocus)) {
      try {
        entry.previousFocus.focus({ preventScroll: true });
      } catch (err) {}
    }
  }

  function openElement(modal, options = {}) {
    if (!(modal instanceof HTMLElement)) return null;
    const container = options.container || document.getElementById('modal-root') || document.body;
    if (!options.stack) {
      udocketModal.closeAll();
    }
    const previousFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
    const entry = {
      modal,
      container,
      onClose: options.onClose,
      previousFocus,
      removeOnClose: options.removeOnClose !== false,
    };
    bindModal(modal, entry);
    modal.dataset.modalVersion = 'base';
    if (options.replaceContainer !== false && container && container !== document.body) {
      container.innerHTML = '';
    }
    container.appendChild(modal);
    modalStack.push(entry);
    lockBodyScroll();
    requestAnimationFrame(() => focusFirst(modal));
    return modal;
  }

  function close(modal, meta = {}) {
    if (!modal) return;
    const index = modalStack.findIndex((item) => item.modal === modal);
    if (index === -1) return;
    const entry = modalStack[index];
    modalStack.splice(index, 1);
    if (entry.cleanupHandlers) {
      try { entry.cleanupHandlers(); } catch (err) {}
    }
    removeModalElement(entry);
    unlockBodyScroll();
    if (typeof entry.onClose === 'function') {
      try {
        entry.onClose(meta);
      } catch (err) {
        console.warn('Modal onClose failed', err);
      }
    }
    restoreFocus(entry);
  }

  function closeAll(meta) {
    const openModals = modalStack.slice();
    openModals.forEach((entry) => close(entry.modal, meta));
  }

  function openFromHTML(html, options = {}) {
    if (!html) return null;
    const template = document.createElement('template');
    template.innerHTML = html.trim();
    const modal = template.content.querySelector('[data-modal]');
    if (!modal) return null;
    return openElement(modal, options);
  }

  function actionClasses(variant) {
    switch (variant) {
      case 'danger':
        return 'inline-flex items-center gap-2 rounded-lg border border-rose-400/40 bg-rose-500/10 px-3 py-1.5 font-semibold text-rose-100 transition hover:bg-rose-500/20';
      case 'primary':
        return 'inline-flex items-center gap-2 rounded-lg border border-primary-400/40 bg-primary-500/10 px-3 py-1.5 font-semibold text-primary-100 transition hover:bg-primary-500/20';
      default:
        return 'inline-flex items-center gap-2 rounded-lg border border-white/20 bg-white/10 px-3 py-1.5 font-semibold text-slate-200 transition hover:border-primary-400 hover:text-white';
    }
  }

  function createModal(options = {}) {
    const overlay = document.createElement('div');
    overlay.className = 'fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/70 p-4 backdrop-blur-sm';
    overlay.dataset.modal = '1';
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    const dialog = document.createElement('div');
    dialog.className = options.dialogClasses || 'relative w-full max-w-3xl rounded-2xl border border-white/10 bg-slate-900/95 p-6 shadow-2xl shadow-black/60';
    dialog.dataset.modalDialog = '1';
    dialog.setAttribute('tabindex', '-1');
    overlay.appendChild(dialog);

    const headerRow = document.createElement('div');
    headerRow.className = 'flex items-start justify-between gap-4';
    dialog.appendChild(headerRow);

    const headerContent = document.createElement('div');
    headerContent.className = 'min-w-0 flex-1';
    headerRow.appendChild(headerContent);

    if (options.heading) {
      const headingEl = document.createElement('p');
      headingEl.className = 'text-xs uppercase tracking-wide text-slate-400';
      headingEl.textContent = options.heading;
      headerContent.appendChild(headingEl);
    }
    if (options.title) {
      const titleEl = document.createElement('h3');
      titleEl.className = 'mt-1 text-lg font-semibold text-white';
      titleEl.textContent = options.title;
      headerContent.appendChild(titleEl);
    }
    if (options.subtitle) {
      const subtitleEl = document.createElement('p');
      subtitleEl.className = 'text-xs text-slate-400';
      subtitleEl.innerHTML = escapeHTML(options.subtitle);
      headerContent.appendChild(subtitleEl);
    }
    if (Array.isArray(options.meta)) {
      const metaWrap = document.createElement('div');
      metaWrap.className = 'mt-2 space-y-1';
      options.meta.forEach((item) => {
        const line = document.createElement('p');
        line.className = 'text-xs text-slate-400';
        if (item.label) {
          const label = document.createElement('span');
          label.className = 'font-semibold uppercase tracking-wide text-slate-500';
          label.textContent = item.label;
          line.appendChild(label);
        }
        if (item.copyText) {
          const copy = document.createElement('span');
          copy.className = 'ml-1 font-mono text-[11px] text-primary-200 cursor-copy underline decoration-dotted decoration-white/20 hover:decoration-primary-300';
          copy.dataset.copyText = item.copyText;
          copy.textContent = item.display || item.copyText;
          line.appendChild(copy);
        } else if (item.display) {
          const span = document.createElement('span');
          span.className = 'ml-1';
          span.textContent = item.display;
          line.appendChild(span);
        }
        metaWrap.appendChild(line);
      });
      headerContent.appendChild(metaWrap);
    }

    const closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'rounded-lg border border-white/20 bg-white/10 p-2 text-slate-300 transition hover:border-primary-400 hover:text-white';
    closeBtn.setAttribute('data-modal-close', 'close');
    const closeSr = document.createElement('span');
    closeSr.className = 'sr-only';
    closeSr.textContent = options.closeLabel || 'Close modal';
    closeBtn.appendChild(closeSr);
    closeBtn.insertAdjacentHTML('beforeend', '<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>');
    headerRow.appendChild(closeBtn);

    const body = document.createElement('div');
    body.className = 'mt-4 max-h-[72vh] overflow-y-auto rounded-lg border border-white/10 bg-slate-950/30 p-4 text-[13px] leading-relaxed text-slate-100';
    body.dataset.modalBody = '1';
    if (options.bodyNode instanceof Node) {
      body.appendChild(options.bodyNode);
    } else if (typeof options.bodyHTML === 'string') {
      body.innerHTML = options.bodyHTML;
    } else if (typeof options.bodyText === 'string') {
      const p = document.createElement('p');
      p.className = 'text-sm text-slate-200';
      p.textContent = options.bodyText;
      body.appendChild(p);
    }
    dialog.appendChild(body);

    const actionsWrap = document.createElement('div');
    actionsWrap.className = 'mt-4 flex flex-wrap items-center justify-end gap-3 text-sm';
    actionsWrap.dataset.modalActions = '1';
    if (Array.isArray(options.actions)) {
      options.actions.forEach((action) => {
        const btn = document.createElement('button');
        btn.type = action.type === 'link' ? 'button' : 'button';
        btn.textContent = action.label || 'Select';
        btn.className = actionClasses(action.variant);
        if (action.autoFocus) {
          btn.dataset.modalAutoFocus = '1';
        }
        btn.addEventListener('click', (evt) => {
          if (typeof action.onClick === 'function') {
            action.onClick({ modal: overlay, event: evt });
          } else {
            udocketModal.close(overlay, { reason: action.reason || 'action' });
          }
        });
        actionsWrap.appendChild(btn);
      });
    }
    dialog.appendChild(actionsWrap);

    return overlay;
  }

  async function confirm(options = {}) {
    return new Promise((resolve) => {
      const modal = createModal({
        heading: options.heading || 'Confirm action',
        title: options.title || '',
        bodyText: options.body || 'Are you sure?',
        closeLabel: options.cancelLabel || 'Cancel',
        actions: [
          {
            label: options.cancelLabel || 'Cancel',
            variant: 'secondary',
            onClick: () => {
              udocketModal.close(modal, { reason: 'cancel' });
              resolve(false);
            },
          },
          {
            label: options.confirmLabel || 'Confirm',
            variant: options.destructive ? 'danger' : 'primary',
            autoFocus: true,
            onClick: () => {
              udocketModal.close(modal, { reason: 'confirm' });
              resolve(true);
            },
          },
        ],
      });
      openElement(modal, { removeOnClose: true, container: options.container });
    });
  }

  async function message(options = {}) {
    return new Promise((resolve) => {
      const modal = createModal({
        heading: options.heading || 'Notice',
        title: options.title || '',
        bodyText: options.body || '',
        closeLabel: options.dismissLabel || 'Close',
        actions: [
          {
            label: options.dismissLabel || 'Close',
            autoFocus: true,
            onClick: () => {
              udocketModal.close(modal, { reason: 'dismiss' });
              resolve();
            },
          },
        ],
      });
      openElement(modal, { removeOnClose: true, container: options.container });
    });
  }

  const udocketModal = {
    open: openElement,
    openFromHTML,
    close,
    closeAll,
    create: createModal,
    confirm,
    message,
  };

  window.udocketModal = udocketModal;
})();
</script>
