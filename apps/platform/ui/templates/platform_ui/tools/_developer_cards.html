<div class="grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-4" data-tool-card-grid>
  {% for card in cards %}
    <button type="button"
            class="flex flex-col justify-between rounded-xl border border-white/10 bg-slate-900/50 p-4 text-left shadow-lg shadow-black/15 transition hover:border-primary-400/60 hover:bg-slate-900/70"
            data-tool-card="{{ card.key }}"
            hx-get="/cases/{{ case.id }}/tools/{{ card.key }}/"
            hx-target="#tool-workspace"
            hx-swap="innerHTML"
            aria-label="Open {{ card.label }}"
            aria-pressed="{% if active_tool == card.key %}true{% else %}false{% endif %}">
      <div class="flex items-start justify-between gap-3">
        <div class="space-y-2">
          <p class="text-xs uppercase tracking-wide text-slate-400">{{ card.label }}</p>
          {% if card.status_summary %}
            <p class="text-sm leading-snug text-slate-200">{{ card.status_summary }}</p>
          {% endif %}
        </div>
        {% if card.status_label %}
          <span class="status-pill inline-flex items-center rounded-full border {{ card.status_class }} px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-white/90 whitespace-nowrap flex-none">{{ card.status_label }}</span>
        {% endif %}
      </div>
      <div class="mt-4 text-[11px] uppercase tracking-wide text-slate-500">
        {% if card.updated_at %}
          Updated <time data-ts="{{ card.updated_at|date:'c' }}" data-ts-format="datetime">{{ card.updated_at|date:'M d, Y h:i A' }}</time>
        {% else %}
          No activity yet
        {% endif %}
      </div>
    </button>
  {% endfor %}
</div>
