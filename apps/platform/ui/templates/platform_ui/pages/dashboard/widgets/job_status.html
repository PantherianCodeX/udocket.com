<div class="rounded-3xl border border-white/10 bg-slate-900/70 p-6 shadow-2xl shadow-black/30">
  <h3 class="text-lg font-semibold text-white">{{ widget.title }}</h3>
  <p class="mt-1 text-sm text-slate-300">{{ widget.description }}</p>
  <dl class="mt-4 grid gap-4 text-sm text-slate-200">
    <div class="flex items-center justify-between rounded-2xl border border-blue-400/30 bg-blue-500/10 px-3 py-2">
      <dt class="uppercase tracking-wide text-xs text-blue-100">Running</dt>
      <dd class="text-lg font-semibold text-white">{{ widget.context.summary.running }}</dd>
    </div>
    <div class="flex items-center justify-between rounded-2xl border border-amber-400/30 bg-amber-500/10 px-3 py-2">
      <dt class="uppercase tracking-wide text-xs text-amber-100">Pending</dt>
      <dd class="text-lg font-semibold text-white">{{ widget.context.summary.pending }}</dd>
    </div>
    <div class="flex items-center justify-between rounded-2xl border border-emerald-400/30 bg-emerald-500/10 px-3 py-2">
      <dt class="uppercase tracking-wide text-xs text-emerald-100">Succeeded</dt>
      <dd class="text-lg font-semibold text-white">{{ widget.context.summary.succeeded }}</dd>
    </div>
    <div class="flex items-center justify-between rounded-2xl border border-rose-400/30 bg-rose-500/10 px-3 py-2">
      <dt class="uppercase tracking-wide text-xs text-rose-100">Needs attention</dt>
      <dd class="text-lg font-semibold text-white">{{ widget.context.summary.failed }}</dd>
    </div>
    <div class="mt-2 rounded-2xl border border-white/10 bg-white/5 px-3 py-2 text-xs text-slate-300">
      Total jobs tracked: <span class="font-semibold text-white">{{ widget.context.summary.total }}</span>
    </div>
  </dl>
</div>
