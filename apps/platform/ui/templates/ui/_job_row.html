<tr data-job="{{ j.id }}" class="transition hover:bg-white/10">
  <td class="px-4 py-3 font-mono text-xs text-primary-200">{{ j.id }}</td>
  <td class="px-4 py-3 text-slate-200 capitalize">{{ j.mode }}</td>
  <td class="px-4 py-3 text-slate-100" id="job-status-{{ j.id }}">{{ j.status }}</td>
  <td class="px-4 py-3 text-slate-200" id="job-transcript-{{ j.id }}">
    {% if j.transcript_path %}
      <a class="font-medium text-primary-300 underline" href="/api/v1/jobs/{{ j.id }}/download/">Download</a>
    {% else %}—{% endif %}
  </td>
  <td class="px-4 py-3 text-primary-200"><a class="underline" href="/api/v1/jobs/{{ j.id }}/logs/">Logs</a></td>
  <td class="px-4 py-3 text-slate-300"><time data-ts="{{ j.created_at|date:'c' }}">{{ j.created_at }}</time></td>
  <td class="px-4 py-3 text-right">
    <button type="button" class="inline-flex items-center rounded-lg border border-white/20 bg-white/10 px-3 py-1.5 text-xs font-semibold text-slate-200 transition hover:border-primary-400 hover:text-white" hx-get="/jobs/{{ j.id }}/detail-panel/" hx-target="#job-detail-modal-body" hx-swap="innerHTML">Details</button>
  </td>
</tr>
