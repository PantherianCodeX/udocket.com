<script>
(function() {
  if (window.udocketPopovers) return;

  const popoverState = new WeakMap();
  const PORTAL_BASE_Z = 2147483636;
  const PANEL_Z_INDEX = 2147483640;

  function ensurePortal(kind) {
    const id = kind ? `popover-portal-${kind}` : 'popover-portal-default';
    let portal = document.getElementById(id);
    if (!portal) {
      portal = document.createElement('div');
      portal.id = id;
      const style = portal.style;
      style.position = 'fixed';
      style.top = '0';
      style.left = '0';
      style.width = '100%';
      style.height = '100%';
      style.pointerEvents = 'none';
      style.zIndex = String(PORTAL_BASE_Z);
      document.body.appendChild(portal);
    }
    return portal;
  }

  function reset(detailsEl) {
    const state = popoverState.get(detailsEl);
    if (!state) return;
    window.removeEventListener('scroll', state.onScroll, true);
    window.removeEventListener('resize', state.onResize, true);
    const { panel, original, placeholder, parent, portal, onWheel } = state;
    if (panel && panel.isConnected) {
      Object.entries(original).forEach(([key, value]) => {
        panel.style[key] = value;
      });
      panel.dataset.floating = '';
      if (placeholder && parent && parent.isConnected) {
        try { parent.insertBefore(panel, placeholder); } catch (err) {}
        try { placeholder.remove(); } catch (err) {}
      }
    }
    if (portal) {
      portal.style.zIndex = String(PORTAL_BASE_Z);
      portal.style.pointerEvents = 'none';
    }
    if (onWheel && panel) {
      try {
        panel.removeEventListener('wheel', onWheel, { passive: false });
      } catch (err) {
        panel.removeEventListener('wheel', onWheel);
      }
    }
    popoverState.delete(detailsEl);
  }

  function float(detailsEl) {
    const panel = detailsEl.querySelector('[data-popover-panel]');
    const summary = detailsEl.querySelector('summary');
    if (!panel || !summary) return;
    reset(detailsEl);
    const original = {
      position: panel.style.position,
      top: panel.style.top,
      left: panel.style.left,
      right: panel.style.right,
      bottom: panel.style.bottom,
      zIndex: panel.style.zIndex,
      maxHeight: panel.style.maxHeight,
      pointerEvents: panel.style.pointerEvents,
      visibility: panel.style.visibility,
    };
    const parent = panel.parentElement;
    const usePortal = (detailsEl.getAttribute('data-popover-portal') || '').toLowerCase() === 'body';
    let placeholder = null;
    let portal = null;
    if (usePortal && parent) {
      placeholder = document.createComment('popover-placeholder');
      try { parent.insertBefore(placeholder, panel); } catch (err) {}
      const key = detailsEl.getAttribute('data-popover') || 'menu';
      portal = ensurePortal(key);
      portal.style.zIndex = String(PORTAL_BASE_Z + 2);
      portal.style.pointerEvents = 'auto';
      portal.appendChild(panel);
      panel.style.pointerEvents = 'auto';
    }

    panel.dataset.floating = '1';
    panel.style.visibility = 'hidden';
    panel.style.position = 'absolute';
    panel.style.zIndex = usePortal ? String(PANEL_Z_INDEX) : '9999';
    panel.style.contain = 'layout paint';
    panel.style.isolation = 'isolate';
    panel.style.transform = 'translateZ(0)';

    const gap = 8;
    const margin = 16;
    const viewportCap = Math.max(240, Math.floor(window.innerHeight * 0.9));

    const positionPanel = () => {
      if (!detailsEl.isConnected || !detailsEl.open) {
        reset(detailsEl);
        return;
      }
      const rect = summary.getBoundingClientRect();
      const width = panel.offsetWidth || panel.scrollWidth || 240;
      let measuredHeight = panel.offsetHeight || panel.scrollHeight || 200;
      const availableDown = window.innerHeight - rect.bottom - gap - margin;
      const availableUp = rect.top - gap - margin;
      const openDown = availableDown >= availableUp;
      let maxHeight = viewportCap;
      if (openDown && availableDown > 0) {
        maxHeight = Math.min(viewportCap, availableDown + margin);
      } else if (!openDown && availableUp > 0) {
        maxHeight = Math.min(viewportCap, availableUp + margin);
      }
      if (measuredHeight > maxHeight) {
        panel.style.maxHeight = `${maxHeight}px`;
        panel.style.overflowY = 'auto';
        panel.style.overscrollBehavior = 'contain';
        measuredHeight = maxHeight;
      } else {
        panel.style.maxHeight = '';
        panel.style.overflowY = '';
        panel.style.overscrollBehavior = '';
      }

      const docLeft = rect.left + window.scrollX;
      const docTop = rect.top + window.scrollY;
      const viewportWidth = document.documentElement.clientWidth;
      let left = docLeft + rect.width - width;
      left = Math.min(left, window.scrollX + viewportWidth - width - margin);
      left = Math.max(window.scrollX + margin, left);
      let top = openDown ? docTop + rect.height + gap : docTop - measuredHeight - gap;

      if (usePortal) {
        panel.style.left = `${Math.round(left)}px`;
        panel.style.top = `${Math.round(top)}px`;
      } else if (parent) {
        const parentRect = parent.getBoundingClientRect();
        const parentDocLeft = parentRect.left + window.scrollX;
        const parentDocTop = parentRect.top + window.scrollY;
        panel.style.left = `${Math.round(left - parentDocLeft)}px`;
        panel.style.top = `${Math.round(top - parentDocTop)}px`;
      } else {
        panel.style.left = `${Math.round(left)}px`;
        panel.style.top = `${Math.round(top)}px`;
      }
      panel.style.visibility = 'visible';
    };

    const state = {
      panel,
      original,
      placeholder,
      parent,
      portal,
      onScroll: positionPanel,
      onResize: positionPanel,
      onWheel: null,
    };
    popoverState.set(detailsEl, state);
    positionPanel();
    window.addEventListener('scroll', positionPanel, true);
    window.addEventListener('resize', positionPanel, true);

    const wheelHandler = (evt) => {
      if (!detailsEl.open || !panel) return;
      const delta = evt.deltaY;
      evt.preventDefault();
      panel.scrollTop += delta;
    };
    try {
      panel.addEventListener('wheel', wheelHandler, { passive: false });
    } catch (err) {
      panel.addEventListener('wheel', wheelHandler);
    }
    state.onWheel = wheelHandler;
  }

  function close(detailsEl) {
    if (!detailsEl) return;
    reset(detailsEl);
    detailsEl.removeAttribute('open');
  }

  function closeAll(filterSelector, except) {
    const selector = filterSelector || '[data-popover][open]';
    document.querySelectorAll(selector).forEach((menu) => {
      if (menu === except) return;
      close(menu);
    });
  }

  function handleSummaryClick(evt) {
    const summary = evt.target.closest('[data-popover] > summary');
    if (!summary) return false;
    const owner = summary.closest('[data-popover]');
    if (!(owner instanceof HTMLElement)) return false;
    evt.preventDefault();
    evt.stopPropagation();
    const willOpen = !owner.open;
    const isTranscript = owner.matches('[data-transcript-item]');
    if (isTranscript) {
      closeAll('[data-transcript-item][open]', owner);
    } else {
      closeAll('[data-popover][open]', owner);
    }
    if (willOpen) {
      owner.open = true;
      requestAnimationFrame(() => float(owner));
    } else {
      close(owner);
    }
    evt.udocketPopoverHandled = true;
    return true;
  }

  function isWithinPopover(target) {
    if (!target) return false;
    return Boolean(target.closest('[data-popover]') || target.closest('[data-popover-panel]'));
  }

  function handleDocumentClick(evt) {
    if (evt.udocketPopoverHandled) return;
    if (handleSummaryClick(evt)) return;
    if (!isWithinPopover(evt.target)) {
      closeAll();
    }
  }

  function handleDocumentKeydown(evt) {
    if (evt.key === 'Escape') {
      closeAll();
    }
  }

  function handleDocumentFocus(evt) {
    if (!isWithinPopover(evt.target)) {
      closeAll();
    }
  }

  document.addEventListener('click', (evt) => {
    handleSummaryClick(evt);
  }, true);

  document.addEventListener('click', handleDocumentClick);
  document.addEventListener('keydown', handleDocumentKeydown);
  document.addEventListener('focusin', handleDocumentFocus);

  window.udocketPopovers = {
    reset,
    float,
    close,
    closeAll,
    state: popoverState,
  };
})();
</script>
