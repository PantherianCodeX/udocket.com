{% extends "ui/base.html" %}
{% block content %}
  <h2>Cases</h2>
  <table>
    <thead><tr><th>ID</th><th>Title</th><th>Created</th></tr></thead>
    <tbody>
      {% for c in cases %}
      <tr>
        <td><a href="/cases/{{ c.id }}/">{{ c.id }}</a></td>
        <td>{{ c.title }}</td>
        <td>{{ c.created_at }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="3">No cases yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>

  <h3>Create Case</h3>
  <form method="post">
    {% csrf_token %}
    <label>Case ID: <input type="text" name="case_id" required></label>
    <label>Title: <input type="text" name="title"></label>
    <button type="submit">Create</button>
  </form>
{% endblock %}
