<div class="grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-4" data-tool-card-grid>
  {% for card in cards %}
    <button type="button"
            class="flex flex-col justify-between rounded-xl border border-white/10 bg-slate-900/50 p-3 text-left shadow-lg shadow-black/15 transition hover:border-primary-400/60 hover:bg-slate-900/70"
            data-tool-card="{{ card.key }}"
            hx-get="/cases/{{ case.id }}/tools/{{ card.key }}/"
            hx-target="#tool-workspace"
            hx-swap="innerHTML"
            aria-label="Open {{ card.label }}"
            aria-pressed="{% if active_tool == card.key %}true{% else %}false{% endif %}">
      <div class="flex items-start justify-between gap-3">
        <div>
          <p class="text-xs uppercase tracking-wide text-slate-400">{{ card.label }}</p>
          <p class="mt-2 text-xs text-slate-300">{{ card.description }}</p>
        </div>
        {% if card.status_label %}
          <span class="status-pill inline-flex items-center rounded-full border {{ card.status_class }} px-2 py-0.5 text-[10px] font-semibold uppercase text-white/90">{{ card.status_label }}</span>
        {% endif %}
      </div>
      <div class="mt-3 text-[11px] text-slate-500">
        {% if card.updated_at %}
          Updated <time data-ts="{{ card.updated_at|date:'c' }}">{{ card.updated_at|date:'M j, Y g:i A' }}</time>
        {% else %}
          No activity yet
        {% endif %}
      </div>
    </button>
  {% endfor %}
</div>
