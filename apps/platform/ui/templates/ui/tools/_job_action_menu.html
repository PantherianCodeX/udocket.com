{% if actions %}
  <details class="relative inline-block" data-job-action-menu>
    <summary class="inline-flex cursor-pointer items-center gap-2 rounded-lg border border-white/15 bg-white/5 px-3 py-1.5 text-xs font-semibold text-slate-100 transition hover:border-primary-400 hover:text-white">
      Manage
      <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.094l3.71-3.86a.75.75 0 111.08 1.04l-4.247 4.41a.75.75 0 01-1.08 0L5.21 8.27a.75.75 0 01.02-1.06z" clip-rule="evenodd" /></svg>
    </summary>
    <div class="absolute right-0 z-40 mt-2 w-52 space-y-1 rounded-xl border border-white/10 bg-slate-900/95 p-2 text-xs text-slate-200 shadow-xl shadow-black/40" data-job-action-menu-panel>
      {% for action in actions %}
        <button type="button"
                class="flex w-full items-center justify-between gap-2 rounded-lg px-3 py-1.5 text-left font-semibold text-slate-200 transition hover:bg-white/10"
                data-job-action-item
                data-job-action="{{ action.action }}"
                data-job-id="{{ action.job_id }}"
                {% if action.query %}data-job-action-query="{{ action.query }}"{% endif %}
                {% if action.confirm %}data-job-action-confirm="{{ action.confirm }}"{% endif %}
                {% if action.prompt %}data-job-action-prompt="{{ action.prompt }}"{% endif %}
                {% if action.visible_when %}data-visible-when="{{ action.visible_when }}"{% endif %}>
          <span>{{ action.label }}</span>
        </button>
      {% endfor %}
      <p class="hidden px-3 py-1 text-[11px] text-slate-400" data-job-action-empty>No actions available.</p>
    </div>
  </details>
{% else %}
  <span class="text-xs text-slate-500">—</span>
{% endif %}
