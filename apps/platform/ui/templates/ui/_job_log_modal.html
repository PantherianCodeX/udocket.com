{% load ui_display %}
<div class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/70 p-4 backdrop-blur-sm" data-modal>
  <div class="w-full max-w-3xl rounded-2xl border border-white/10 bg-slate-900/95 p-6 shadow-2xl shadow-black/60">
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="text-xs uppercase tracking-wide text-slate-400">Job Logs</p>
        <h3 class="mt-1 text-lg font-semibold text-white">Job {{ job_id|short_uuid }}</h3>
        <p class="text-xs text-slate-400">Log path: {% if log_path %}<span class="font-mono text-[11px] text-primary-200" data-copy-text="{{ log_path }}">{{ log_path|truncate_middle:"32,16" }}</span>{% else %}Not available{% endif %}</p>
      </div>
      <button type="button" class="rounded-lg border border-white/20 bg-white/10 p-2 text-slate-300 transition hover:border-primary-400 hover:text-white" data-modal-close>
        <span class="sr-only">Close job log</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
      </button>
    </div>
    <div class="mt-4 max-h-[28rem] overflow-y-auto rounded-lg border border-white/10 bg-slate-950/30 p-4 text-[13px] leading-relaxed text-slate-100">
      {% if log_text %}
        <pre class="whitespace-pre-wrap break-words">{{ log_text }}</pre>
      {% else %}
        <p class="text-sm text-slate-400">No log entries recorded for this job.</p>
      {% endif %}
    </div>
    <div class="mt-4 flex justify-end">
      <button type="button" class="inline-flex items-center gap-2 rounded-lg bg-primary-500 px-4 py-2 text-sm font-semibold text-white shadow-lg shadow-primary-500/30 transition hover:bg-primary-400" data-modal-close>
        Close
      </button>
    </div>
  </div>
</div>
