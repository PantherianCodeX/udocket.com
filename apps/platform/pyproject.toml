[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "udocket-platform"
version = "0.1.0"
description = "uDocket Django platform and worker processes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "Django>=5.2.7,<5.3",
    "django-environ>=0.12.0",
    "pydantic-settings>=2.11.0,<3",
    "djangorestframework>=3.16.1",
    "drf-spectacular>=0.28.0",
    "django-guardian>=3.2.0",
    "drf-access-policy>=1.5.0",
    "mozilla-django-oidc>=4.0.1",
    "djangorestframework-simplejwt[crypto]>=5.5.1",
    "psycopg[binary]>=3.2.10",
    "channels>=4.3.1",
    "channels-redis>=4.3.0",
    "asgiref>=3.10.0",
    "redis>=6.4.0",
    "daphne>=4.2.1",
    "celery>=5.5.3",
    "django-celery-beat>=2.8.1",
    "django-celery-results>=2.6.0",
    "PyYAML>=6.0.3",
    "azure-storage-blob>=12.27.0",
    "django-simple-history>=3.10.1",
    "azure-cognitiveservices-speech>=1.46.0,<2",
    "docxtpl>=0.20.1,<0.21",
    "langgraph>=0.6.10,<0.7",
    "Pillow>=12.0.0,<13",
    "requests>=2.32.5,<3",
    "typing-extensions>=4.15.0,<5",
    "urllib3>=2.5.0,<3",
]

[tool.setuptools.packages.find]
where = ["apps/platform"]
include = ["*" ]

[tool.uv]
dev-dependencies = [
    "pytest>=8.4.2",
    "pytest-django>=4.11.1",
    "pytest-asyncio>=1.2.0",
    "pyright>=1.1.406",
    "mypy>=1.18.2",
    "django-stubs[compatible-mypy]>=5.2.7",
    "djangorestframework-stubs>=3.16.4",
    "channels-stubs>=0.1.9",
    "types-requests>=2.32.4.20250913",
    "types-requests-oauthlib>=2.0.0.20250809",
    "types-redis>=4.6.0.20241004",
    "types-PyYAML>=6.0.12.20250915",
    "types-python-jose>=3.5.0.20250531",
    "types-pyOpenSSL>=24.1.0.20240722",
    "types-cffi>=1.17.0.20250915",
    "types-setuptools>=80.9.0.20250822",
    "types-oauthlib>=3.3.0.20250822",
    "types-python-dateutil>=2.9.0.20251008",
    "types-pyasn1>=0.6.0.20250914",
    "celery-stubs>=0.1.3",
    "flake8>=7.3.0",
    "black>=25.9.0",
    "bandit>=1.8.6",
    "django-upgrade>=1.29.0",
    "typewiz @ git+https://github.com/PantherianCodeX/typewiz@v0.1.0",
]
