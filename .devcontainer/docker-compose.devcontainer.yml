services:
  platform-dev:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.platform
      network: host
      cache_from:
        - type=local,src=.docker/buildx-cache/dev
      args:
        DEV_TOOLS: "1"
        # Allow choosing a different base image without editing the Dockerfile
        PYTHON_BASE: "${PYTHON_BASE:-python:3.12-slim-bookworm}"
    env_file:
      - ./.env
    environment:
      DJANGO_SETTINGS_MODULE: apps.platform.config.settings.dev
      ENV_READ_DOTENV: "1"
      ALLOW_SQLITE_DEV_FALLBACK: "1"
    command: sleep infinity
    volumes:
      - vscode-server:/root/.vscode-server
      # Persist HOME config/cache so CLI chat history survives rebuilds
      - home-config:/root/.config
      - home-cache:/root/.cache
      - home-local-share:/root/.local/share
      - codex-data:/root/.codex
      - .:/app
      - ./storage:/app/storage
      - ./.env:/app/.env:rw
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_ADMIN
    shm_size: 1g

  # Override service port publishing when running inside the devcontainer
  # Keep internal networking the same; only change host bindings to avoid conflicts
  redis:
    # Do not publish Redis on the host; containers use service name `redis:6379`
    ports: []

  postgres:
    # Remap host port to avoid conflicts with a host PostgreSQL
    # Internal port remains 5432 so other services keep working
    ports:
      - "5434:5432"
volumes:
  vscode-server: {}
  home-config: {}
  home-cache: {}
  home-local-share: {}
  codex-data: {}
