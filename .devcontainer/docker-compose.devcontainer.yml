services:
  platform-dev:
    build:
      context: ${PWD}
      dockerfile: infra/docker/Dockerfile.platform
      args:
        DEV_TOOLS: "1"
    env_file:
      - ${PWD}/.env
    environment:
      DJANGO_SETTINGS_MODULE: apps.platform.config.settings.dev
      ENV_READ_DOTENV: "1"
      ALLOW_SQLITE_DEV_FALLBACK: "1"
    command: sleep infinity
    volumes:
      - vscode-server:/root/.vscode-server
      - ${PWD}:/app
      - ${PWD}/storage:/app/storage
      - ${PWD}/.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
 
volumes:
  vscode-server: {}
