services:
  api:
    # Mount source for instant edits inside the container
    volumes:
      - .:/app
    # Enable hot reload for the API during development
    command: >-
      uvicorn apps.api.app.main:app
      --host 0.0.0.0 --port 8080 --workers 1
      --reload --reload-dir /app
      --log-config infra/logging/uvicorn.yml
    # Auto-rebuild image when Dockerfile or deps change
    develop:
      watch:
        - path: infra/docker/Dockerfile.api
          action: rebuild
        - path: apps/api/requirements.txt
          action: rebuild

  platform:
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: apps.platform.config.settings.dev
      CELERY_TASK_ALWAYS_EAGER: "0"
    command: "sh -lc \"python -m pip install -q --no-input watchfiles && python manage.py migrate && python -m watchfiles --target-type=command --filter=python --ignore-paths=/app/.venv --ignore-paths=/app/storage --ignore-paths=/app/celerybeat-schedule --grace-period=0.2 'daphne -b 0.0.0.0 -p 8000 apps.platform.config.asgi:application' /app\""
    develop:
      watch:
        - path: infra/docker/Dockerfile.platform
          action: rebuild
        - path: apps/platform/requirements.txt
          action: rebuild

  platform_worker:
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: apps.platform.config.settings.dev
      CELERY_TASK_ALWAYS_EAGER: "0"
    command: sh -lc "python -m pip install -q --no-input watchfiles && celery -A apps.platform.config.celery worker -l info"
    develop:
      watch:
        - path: infra/docker/Dockerfile.platform
          action: rebuild
        - path: apps/platform/requirements.txt
          action: rebuild

  platform_beat:
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: apps.platform.config.settings.dev
      CELERY_TASK_ALWAYS_EAGER: "0"
    command: sh -lc "celery -A apps.platform.config.celery beat -l info"
    develop:
      watch:
        - path: infra/docker/Dockerfile.platform
          action: rebuild
        - path: apps/platform/requirements.txt
          action: rebuild
