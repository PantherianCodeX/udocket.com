name: Docs CI
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  publish-toolbox:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/udocket-docs-toolbox
    steps:
      - uses: actions/checkout@v4
      - name: Compute lock digest
        id: meta
        working-directory: packages/docs_tooling
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: compute lock digest" >> "$GITHUB_STEP_SUMMARY"
          lock_sha=$(sha256sum uv.lock | cut -d' ' -f1)
          printf 'lock_sha=%s\n' "$lock_sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "Finished: compute lock digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push docs toolbox image
        uses: docker/build-push-action@v5
        with:
          context: packages/docs_tooling
          file: packages/docs_tooling/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.lock_sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=docs-toolbox
          cache-to: type=gha,scope=docs-toolbox,mode=max

  lint-build:
    runs-on: ubuntu-latest
    env:
      VALE_VERSION: 3.7.1
      PUPPETEER_SKIP_DOWNLOAD: "1"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          check-latest: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: install uv" >> "$GITHUB_STEP_SUMMARY"
          curl -LsSf https://astral.sh/uv/install.sh | sh -s -- -y
          printf '%s\n' "Finished: install uv" >> "$GITHUB_STEP_SUMMARY"
      - name: Install system dependencies
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: install system dependencies" >> "$GITHUB_STEP_SUMMARY"
          sudo apt-get update
          sudo apt-get install -y chromium pandoc
          printf '%s\n' "Finished: install system dependencies" >> "$GITHUB_STEP_SUMMARY"
      - name: Install docs dependencies
        working-directory: packages/docs_tooling
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: install docs dependencies" >> "$GITHUB_STEP_SUMMARY"
          uv sync --frozen --extra dev
          npm ci
          printf '%s\n' "Finished: install docs dependencies" >> "$GITHUB_STEP_SUMMARY"
      - name: Add local node binaries to PATH
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: add local node binaries to PATH" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$PWD/packages/docs_tooling/node_modules/.bin" >> "$GITHUB_PATH"
          printf '%s\n' "Finished: add local node binaries to PATH" >> "$GITHUB_STEP_SUMMARY"
      - name: Markdownlint
        working-directory: packages/docs_tooling
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: markdownlint" >> "$GITHUB_STEP_SUMMARY"
          npx markdownlint-cli2 'docs/**/*.md' '!docs/build/**' '!site/**'
          printf '%s\n' "Finished: markdownlint" >> "$GITHUB_STEP_SUMMARY"
      - name: Vale
        working-directory: packages/docs_tooling
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: vale lint" >> "$GITHUB_STEP_SUMMARY"
          vale --config config/vale.ini docs/
          printf '%s\n' "Finished: vale lint" >> "$GITHUB_STEP_SUMMARY"
      - name: Mermaid render (all)
        working-directory: packages/docs_tooling
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: render mermaid diagrams" >> "$GITHUB_STEP_SUMMARY"
          bash tools/render_mermaid.sh --all --verbose
          printf '%s\n' "Finished: render mermaid diagrams" >> "$GITHUB_STEP_SUMMARY"
      - name: MkDocs build (HTML)
        working-directory: packages/docs_tooling
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: mkdocs build" >> "$GITHUB_STEP_SUMMARY"
          uv run mkdocs build --config-file mkdocs.yml --site-dir site --clean
          printf '%s\n' "Finished: mkdocs build" >> "$GITHUB_STEP_SUMMARY"
      - name: PDF build (TDD + PRD)
        working-directory: packages/docs_tooling
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: pdf build" >> "$GITHUB_STEP_SUMMARY"
          uv run python tools/pdf_build.py --skip-build
          printf '%s\n' "Finished: pdf build" >> "$GITHUB_STEP_SUMMARY"
      - name: Lint docs suite
        working-directory: packages/docs_tooling
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: lint docs suite" >> "$GITHUB_STEP_SUMMARY"
          uv run python -m docs.tools.manage_docs --lint
          printf '%s\n' "Finished: lint docs suite" >> "$GITHUB_STEP_SUMMARY"

  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress 'docs/src/**/*.md' --exclude-mail
