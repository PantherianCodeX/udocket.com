name: Docs CI
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install tools
        run: |
          npm i -g @mermaid-js/mermaid-cli markdownlint-cli2
          pip install mkdocs mkdocs-material vale==3.7.1
          sudo apt-get update && sudo apt-get install -y pandoc
      - name: Markdownlint
        run: npx markdownlint-cli2 'docs/src/**/*.md'
      - name: Vale
        run: |
          cd docs
          vale src/
      - name: Mermaid render (all)
        run: bash scripts/docs/render_mermaid.sh --all --verbose
      - name: MkDocs build (HTML)
        run: mkdocs -f docs/mkdocs.yml build --clean
      - name: Pandoc dry-run (TDD only)
        run: |
          mkdir -p docs/build/pdf
          bash scripts/docs/build_pdf_tdd.sh

  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress 'docs/src/**/*.md' --exclude-mail
