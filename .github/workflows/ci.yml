name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.*"
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --frozen --group dev --no-install-project --project apps/platform
      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: apps.platform.config.settings.dev
          DATABASE_URL: sqlite:///./udocket_ci.db
        run: uv run --project apps/platform python manage.py migrate --noinput
      - name: Type checks (pyright baseline)
        run: uv run --project apps/platform pyright

      - name: Type checks (mypy baseline)
        env:
          MYPY_CACHE_DIR: .mypy_cache
        run: uv run --project apps/platform mypy

      - name: Enforce strict pragma presence
        run: uv run --project apps/platform python scripts/typing/ci_enforce_strict.py

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: apps.platform.config.settings.dev
          DATABASE_URL: sqlite:///./udocket_ci.db
          CELERY_TASK_ALWAYS_EAGER: '1'
          PLATFORM_DEV_OPEN: '1'
        run: uv run --project apps/platform pytest -q
      - name: Strict manifest check
        run: uv run --project apps/platform python scripts/typing/check_strict.py

  typewiz-audit:
    name: Typewiz Audit
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.*"
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --frozen --group dev --no-install-project --project apps/platform
      - name: Run typewiz audit
        run: |
          mkdir -p reports/typing
          uv run --project apps/platform typewiz audit --max-depth 3 --manifest reports/typing/typing_audit.json
      - name: Build dashboards
        if: always()
        run: |
          uv run --project apps/platform typewiz dashboard --manifest reports/typing/typing_audit.json --format markdown --output reports/typing/dashboard.md || true
          uv run --project apps/platform typewiz dashboard --manifest reports/typing/typing_audit.json --format html --output reports/typing/dashboard.html || true
      - name: Readiness summary
        if: always()
        run: |
          echo "Typewiz blocked folders (top 20):" >> $GITHUB_STEP_SUMMARY
          uv run --project apps/platform typewiz readiness --manifest reports/typing/typing_audit.json --level folder --status blocked --limit 20 >> $GITHUB_STEP_SUMMARY || true
          echo "\nTypewiz ready folders (top 20):" >> $GITHUB_STEP_SUMMARY
          uv run --project apps/platform typewiz readiness --manifest reports/typing/typing_audit.json --level folder --status ready --limit 20 >> $GITHUB_STEP_SUMMARY || true
      - name: Upload typewiz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typewiz-reports
          path: |
            reports/typing/typing_audit.json
            reports/typing/dashboard.md
            reports/typing/dashboard.html

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.*"
          python-version: "3.12"
      - name: Verify platform lockfile
        working-directory: apps/platform
        run: uv lock --check
      - name: Verify docs lockfile
        working-directory: packages/udocket_docs
        run: uv lock --check
      - name: Ensure lockfiles committed
        run: git diff --exit-code
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Prepare sbom directory
        run: mkdir -p sbom
      - name: Build platform image
        run: docker buildx build --file infra/docker/Dockerfile.platform --target app --tag udocket-platform:ci --load .
      - name: Build docs image
        run: docker buildx build --file packages/udocket_docs/Dockerfile --tag udocket-docs:ci --load packages/udocket_docs
      - name: Generate platform SBOM
        uses: anchore/sbom-action@v0
        with:
          image: udocket-platform:ci
          output-format: cyclonedx-json
          output-file: sbom/udocket-platform.cyclonedx.json
      - name: Generate docs SBOM
        uses: anchore/sbom-action@v0
        with:
          image: udocket-docs:ci
          output-format: cyclonedx-json
          output-file: sbom/udocket-docs.cyclonedx.json
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-bundle
          path: sbom
