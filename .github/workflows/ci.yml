name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/platform/requirements.txt -r apps/platform/requirements-stubs.txt
          pip install mypy pyright
      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: apps.platform.config.settings.dev
          DATABASE_URL: sqlite:///./udocket_ci.db
        run: |
          python manage.py migrate --noinput
      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: apps.platform.config.settings.dev
          DATABASE_URL: sqlite:///./udocket_ci.db
          CELERY_TASK_ALWAYS_EAGER: '1'
          PLATFORM_DEV_OPEN: '1'
        run: |
          pytest -q
      - name: Type check (mypy)
        run: mypy packages/udocket_core/logging
      - name: Type check (pyright)
        run: pyright packages/udocket_core/logging
