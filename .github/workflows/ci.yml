name: CI

on:
  push:
  pull_request:

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: devops-actions/actionlint@v0.1.9

  ruff:
    needs: lint-workflows
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [platform, core, common]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.*"
      - name: Sync dependencies
        run: |
          set -euo pipefail
          case "${{ matrix.package }}" in
            platform)
              uv sync --frozen --group dev --project apps/platform
              ;;
            core)
              uv sync --frozen --group dev --project packages/core
              ;;
            common)
              uv sync --frozen --group dev --project packages/common
              ;;
          esac
      - name: Ruff check
        run: |
          set -euo pipefail
          case "${{ matrix.package }}" in
            platform)
              uv run --project apps/platform --extra dev ruff check apps/platform
              ;;
            core)
              uv run --project packages/core --extra dev ruff check packages/core
              ;;
            common)
              uv run --project packages/common --extra dev ruff check packages/common
              ;;
          esac

  pyright:
    needs: lint-workflows
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [platform, core, common]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.*"
      - name: Sync dependencies
        run: |
          set -euo pipefail
          case "${{ matrix.package }}" in
            platform)
              uv sync --frozen --group dev --project apps/platform
              ;;
            core)
              uv sync --frozen --group dev --project packages/core
              ;;
            common)
              uv sync --frozen --group dev --project packages/common
              ;;
          esac
      - name: Pyright
        run: |
          set -euo pipefail
          case "${{ matrix.package }}" in
            platform)
              uv run --project apps/platform --extra dev pyright apps/platform
              ;;
            core)
              uv run --project packages/core --extra dev pyright packages/core
              ;;
            common)
              uv run --project packages/common --extra dev pyright packages/common
              ;;
          esac

  mypy:
    needs: lint-workflows
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [platform, core, common]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.*"
      - name: Sync dependencies
        run: |
          set -euo pipefail
          case "${{ matrix.package }}" in
            platform)
              uv sync --frozen --group dev --project apps/platform
              ;;
            core)
              uv sync --frozen --group dev --project packages/core
              ;;
            common)
              uv sync --frozen --group dev --project packages/common
              ;;
          esac
      - name: Mypy
        env:
          MYPY_CACHE_DIR: .mypy_cache
        run: |
          set -euo pipefail
          case "${{ matrix.package }}" in
            platform)
              uv run --project apps/platform --extra dev mypy apps/platform
              ;;
            core)
              uv run --project packages/core --extra dev mypy packages/core
              ;;
            common)
              uv run --project packages/common --extra dev mypy packages/common
              ;;
          esac

  typing-scripts:
    needs: lint-workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.*"
      - name: Sync platform dependencies
        working-directory: apps/platform
        run: |
          set -euo pipefail
          uv sync --frozen --group dev --no-install-project
      - name: Enforce strict pragmas
        run: |
          uv run --project apps/platform --extra dev python scripts/typing/ci_enforce_strict.py
      - name: Strict manifest check
        run: |
          uv run --project apps/platform --extra dev python scripts/typing/check_strict.py

  typewiz:
    needs: lint-workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.*"
      - name: Sync platform dependencies
        working-directory: apps/platform
        run: |
          set -euo pipefail
          uv sync --frozen --group dev --no-install-project
      - name: Typewiz audit
        run: |
          set -euo pipefail
          mkdir -p out/test-reports/typing
          uv run --project apps/platform --extra dev typewiz audit --mode current --manifest out/test-reports/typing/typing_audit.json
          uv run --project apps/platform --extra dev typewiz dashboard --manifest out/test-reports/typing/typing_audit.json --format markdown --output out/test-reports/typing/dashboard.md || true
          uv run --project apps/platform --extra dev typewiz dashboard --manifest out/test-reports/typing/typing_audit.json --format html --output out/test-reports/typing/dashboard.html || true
          printf '%s\n' "Typewiz blocked folders (top 20):" >> "$GITHUB_STEP_SUMMARY"
          uv run --project apps/platform --extra dev typewiz readiness --manifest out/test-reports/typing/typing_audit.json --level folder --status blocked --limit 20 >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          printf '\nTypewiz ready folders (top 20):\n' >> "$GITHUB_STEP_SUMMARY"
          uv run --project apps/platform --extra dev typewiz readiness --manifest out/test-reports/typing/typing_audit.json --level folder --status ready --limit 20 >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
      - name: Upload typewiz artifacts
        uses: actions/upload-artifact@v4
        with:
          name: typewiz-reports
          path: |
            out/test-reports/typing/typing_audit.json
            out/test-reports/typing/dashboard.md
            out/test-reports/typing/dashboard.html

  tests:
    needs: lint-workflows
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [platform, core, common, docs]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.*"
      - name: Sync dependencies
        run: |
          set -euo pipefail
          case "${{ matrix.package }}" in
            platform)
              uv sync --frozen --group dev --project apps/platform
              ;;
            core)
              uv sync --frozen --group dev --project packages/core
              ;;
            common)
              uv sync --frozen --group dev --project packages/common
              ;;
            docs)
              uv sync --frozen --extra dev --project packages/docs_tooling
              ;;
          esac
      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: apps.platform.config.settings.dev
          DATABASE_URL: sqlite:///./udocket_ci.db
          CELERY_TASK_ALWAYS_EAGER: '1'
          PLATFORM_DEV_OPEN: '1'
          COVERAGE_FILE: .coverage.${{ matrix.package }}
        run: |
          set -euo pipefail
          case "${{ matrix.package }}" in
            platform)
              uv run --project apps/platform --extra dev python manage.py migrate --noinput
              uv run --project apps/platform --extra dev pytest -n auto --cov=apps/platform --cov-report=term --cov-report=xml:coverage-${{ matrix.package }}.xml tests
              ;;
            core)
              uv run --project packages/core --extra dev pytest -n auto --cov=packages/core --cov-report=term --cov-report=xml:coverage-${{ matrix.package }}.xml tests/core
              ;;
            common)
              uv run --project packages/common --extra dev pytest -n auto --cov=packages/common --cov-report=term --cov-report=xml:coverage-${{ matrix.package }}.xml packages/common
              ;;
            docs)
              uv run --project packages/docs_tooling --extra dev python -m doc_tools.pytest_runner --coverage
              if [ -f coverage.xml ]; then mv coverage.xml coverage-${{ matrix.package }}.xml; fi
              ;;
          esac
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package }}
          path: |
            .coverage.${{ matrix.package }}
            coverage-${{ matrix.package }}.xml
        if-no-files-found: ignore

  prompts:
    needs: lint-workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.*"
      - name: Sync platform dependencies
        working-directory: apps/platform
        run: |
          set -euo pipefail
          uv sync --frozen --group dev --no-install-project
      - name: Lint prompts
        run: |
          make prompts.lint

  requirements:
    needs: lint-workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.*"
      - name: Sync platform dependencies
        working-directory: apps/platform
        run: |
          set -euo pipefail
          uv sync --frozen --group dev --no-install-project
      - name: Verify exported requirements
        run: |
          set -euo pipefail
          make all.export-reqs
          git diff --stat requirements/ >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code requirements/

  coverage-combine:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.*"
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage-artifacts
      - name: Combine coverage
        env:
          COVERAGE_FILE: .coverage
        run: |
          set -euo pipefail
          find coverage-artifacts -name '.coverage.*' -exec mv {} . \;
          uv run --project apps/platform --extra dev coverage combine .coverage.*
          uv run --project apps/platform --extra dev coverage xml
          uv run --project apps/platform --extra dev coverage html
      - name: Upload combined coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-combined
          path: |
            coverage.xml
            htmlcov

  parity:
    needs:
      - ruff
      - pyright
      - mypy
      - typing-scripts
      - typewiz
      - tests
      - prompts
      - requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.*"
      - name: Sync platform dependencies
        working-directory: apps/platform
        run: |
          set -euo pipefail
          uv sync --frozen --group dev --no-install-project
      - name: Make lint aggregate
        run: |
          make all.lint
      - name: Make type aggregate
        run: |
          make all.type
      - name: Make test aggregate
        env:
          DJANGO_SETTINGS_MODULE: apps.platform.config.settings.dev
          DATABASE_URL: sqlite:///./udocket_ci.db
          CELERY_TASK_ALWAYS_EAGER: '1'
          PLATFORM_DEV_OPEN: '1'
        run: |
          make all.test
