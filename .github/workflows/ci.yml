name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/platform/requirements.txt
          pip install pyright
          pip install mypy
      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: apps.platform.config.settings.dev
          DATABASE_URL: sqlite:///./udocket_ci.db
        run: |
          python manage.py migrate --noinput
      - name: Type checks (pyright baseline)
        run: pyright

      - name: Type checks (mypy baseline)
        env:
          MYPY_CACHE_DIR: .mypy_cache
        run: mypy

      - name: Enforce strict pragma presence
        run: python scripts/typing/ci_enforce_strict.py

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: apps.platform.config.settings.dev
          DATABASE_URL: sqlite:///./udocket_ci.db
          CELERY_TASK_ALWAYS_EAGER: '1'
          PLATFORM_DEV_OPEN: '1'
        run: |
          pytest -q
      - name: Strict manifest check
        run: python scripts/typing/check_strict.py
