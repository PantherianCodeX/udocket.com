name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/platform/requirements.txt -r apps/platform/requirements-dev.txt
      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: apps.platform.config.settings.dev
          DATABASE_URL: sqlite:///./udocket_ci.db
        run: |
          python manage.py migrate --noinput
      - name: Type checks (pyright baseline)
        run: pyright

      - name: Type checks (mypy baseline)
        env:
          MYPY_CACHE_DIR: .mypy_cache
        run: mypy

      - name: Enforce strict pragma presence
        run: python scripts/typing/ci_enforce_strict.py

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: apps.platform.config.settings.dev
          DATABASE_URL: sqlite:///./udocket_ci.db
          CELERY_TASK_ALWAYS_EAGER: '1'
          PLATFORM_DEV_OPEN: '1'
        run: |
          pytest -q
      - name: Strict manifest check
        run: python scripts/typing/check_strict.py

  typewiz-audit:
    name: Typewiz Audit
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/platform/requirements.txt -r apps/platform/requirements-dev.txt || exit 0
      - name: Run typewiz audit
        run: |
          mkdir -p reports/typing
          typewiz audit --max-depth 3 --manifest reports/typing/typing_audit.json
      - name: Build dashboards
        if: always()
        run: |
          typewiz dashboard --manifest reports/typing/typing_audit.json --format markdown --output reports/typing/dashboard.md || true
          typewiz dashboard --manifest reports/typing/typing_audit.json --format html --output reports/typing/dashboard.html || true
      - name: Readiness summary
        if: always()
        run: |
          echo "Typewiz blocked folders (top 20):" >> $GITHUB_STEP_SUMMARY
          typewiz readiness --manifest reports/typing/typing_audit.json --level folder --status blocked --limit 20 >> $GITHUB_STEP_SUMMARY || true
          echo "\nTypewiz ready folders (top 20):" >> $GITHUB_STEP_SUMMARY
          typewiz readiness --manifest reports/typing/typing_audit.json --level folder --status ready --limit 20 >> $GITHUB_STEP_SUMMARY || true
      - name: Upload typewiz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typewiz-reports
          path: |
            reports/typing/typing_audit.json
            reports/typing/dashboard.md
            reports/typing/dashboard.html
