name: CI

on:
  push:
  pull_request:

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: devops-actions/actionlint@v0.1.9
  test:
    needs: [lint-workflows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.*"
      - name: Sync dependencies
        working-directory: apps/platform
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: sync dependencies" >> "$GITHUB_STEP_SUMMARY"
          uv sync --frozen --group dev --no-install-project
          printf '%s\n' "Finished: sync dependencies" >> "$GITHUB_STEP_SUMMARY"
      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: apps.platform.config.settings.dev
          DATABASE_URL: sqlite:///./udocket_ci.db
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: run migrations" >> "$GITHUB_STEP_SUMMARY"
          uv run --project apps/platform python manage.py migrate --noinput
          printf '%s\n' "Finished: run migrations" >> "$GITHUB_STEP_SUMMARY"
      - name: Type checks (pyright baseline)
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: pyright type checks" >> "$GITHUB_STEP_SUMMARY"
          uv run --project apps/platform pyright
          printf '%s\n' "Finished: pyright type checks" >> "$GITHUB_STEP_SUMMARY"

      - name: Type checks (mypy baseline)
        env:
          MYPY_CACHE_DIR: .mypy_cache
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: mypy type checks" >> "$GITHUB_STEP_SUMMARY"
          uv run --project apps/platform mypy
          printf '%s\n' "Finished: mypy type checks" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce strict pragma presence
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: enforce strict pragmas" >> "$GITHUB_STEP_SUMMARY"
          uv run --project apps/platform python scripts/typing/ci_enforce_strict.py
          printf '%s\n' "Finished: enforce strict pragmas" >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: apps.platform.config.settings.dev
          DATABASE_URL: sqlite:///./udocket_ci.db
          CELERY_TASK_ALWAYS_EAGER: '1'
          PLATFORM_DEV_OPEN: '1'
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: pytest" >> "$GITHUB_STEP_SUMMARY"
          uv run --project apps/platform pytest -q tests
          printf '%s\n' "Finished: pytest" >> "$GITHUB_STEP_SUMMARY"
      - name: Strict manifest check
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: strict manifest check" >> "$GITHUB_STEP_SUMMARY"
          uv run --project apps/platform python scripts/typing/check_strict.py
          printf '%s\n' "Finished: strict manifest check" >> "$GITHUB_STEP_SUMMARY"
      - name: Docs toolbox tests (coverage enforced)
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: docs toolbox tests (coverage)" >> "$GITHUB_STEP_SUMMARY"
          uv sync --frozen --extra dev --project packages/udocket_docs
          uv run --project packages/udocket_docs --extra dev python -m doc_tools.pytest_runner --coverage
          printf '%s\n' "Finished: docs toolbox tests (coverage)" >> "$GITHUB_STEP_SUMMARY"

  typewiz-audit:
    name: Typewiz Audit
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.*"
      - name: Sync dependencies
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: sync dependencies (typewiz-audit)" >> "$GITHUB_STEP_SUMMARY"
          uv sync --frozen --group dev --no-install-project --project apps/platform
          printf '%s\n' "Finished: sync dependencies (typewiz-audit)" >> "$GITHUB_STEP_SUMMARY"
      - name: Run typewiz audit
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: typewiz audit" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p reports/typing
          uv run --project apps/platform typewiz audit --mode current --manifest reports/typing/typing_audit.json
          printf '%s\n' "Finished: typewiz audit" >> "$GITHUB_STEP_SUMMARY"
      - name: Build dashboards
        if: always()
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: build typewiz dashboards" >> "$GITHUB_STEP_SUMMARY"
          uv run --project apps/platform typewiz dashboard --manifest reports/typing/typing_audit.json --format markdown --output reports/typing/dashboard.md || true
          uv run --project apps/platform typewiz dashboard --manifest reports/typing/typing_audit.json --format html --output reports/typing/dashboard.html || true
          printf '%s\n' "Finished: build typewiz dashboards" >> "$GITHUB_STEP_SUMMARY"
      - name: Readiness summary
        if: always()
        run: |
          set -euo pipefail
          printf '%s\n' "Typewiz blocked folders (top 20):" >> "$GITHUB_STEP_SUMMARY"
          uv run --project apps/platform typewiz readiness --manifest reports/typing/typing_audit.json --level folder --status blocked --limit 20 >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          printf '%s\n' "" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "Typewiz ready folders (top 20):" >> "$GITHUB_STEP_SUMMARY"
          uv run --project apps/platform typewiz readiness --manifest reports/typing/typing_audit.json --level folder --status ready --limit 20 >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
      - name: Upload typewiz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typewiz-reports
          path: |
            reports/typing/typing_audit.json
            reports/typing/dashboard.md
            reports/typing/dashboard.html

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.*"
      - name: Verify platform lockfile
        working-directory: apps/platform
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: verify platform lockfile" >> "$GITHUB_STEP_SUMMARY"
          uv lock --check
          printf '%s\n' "Finished: verify platform lockfile" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify docs lockfile
        working-directory: packages/udocket_docs
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: verify docs lockfile" >> "$GITHUB_STEP_SUMMARY"
          uv lock --check
          printf '%s\n' "Finished: verify docs lockfile" >> "$GITHUB_STEP_SUMMARY"
      - name: Ensure lockfiles committed
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: ensure lockfiles committed" >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code
          printf '%s\n' "Finished: ensure lockfiles committed" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Prepare sbom directory
        run: |
          printf '%s\n' "Starting: prepare sbom directory" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p sbom
          printf '%s\n' "Finished: prepare sbom directory" >> "$GITHUB_STEP_SUMMARY"
      - name: Build platform image
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: build platform image" >> "$GITHUB_STEP_SUMMARY"
          docker buildx build --file packages/udocket_docs/Dockerfile --tag udocket-docs:ci --load .
          printf '%s\n' "Finished: build platform image" >> "$GITHUB_STEP_SUMMARY"
      - name: Build docs image
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: build docs image" >> "$GITHUB_STEP_SUMMARY"
          docker buildx build --file packages/udocket_docs/Dockerfile --tag udocket-docs:ci --load packages/udocket_docs
          printf '%s\n' "Finished: build docs image" >> "$GITHUB_STEP_SUMMARY"
      - name: Generate platform SBOM
        uses: anchore/sbom-action@v0
        with:
          image: udocket-platform:ci
          format: cyclonedx-json
          output-file: sbom/udocket-platform.cyclonedx.json
      - name: Generate docs SBOM
        uses: anchore/sbom-action@v0
        with:
          image: udocket-docs:ci
          format: cyclonedx-json
          output-file: sbom/udocket-docs.cyclonedx.json
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-bundle
          path: sbom

  stack-smoke:
    name: Stack Smoke
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Compose smoke test
        run: |
          set -euo pipefail
          printf '%s\n' "Starting: stack smoke" >> "$GITHUB_STEP_SUMMARY"
          PROJECT_NAME=ci make stack.smoke
          printf '%s\n' "Finished: stack smoke" >> "$GITHUB_STEP_SUMMARY"
