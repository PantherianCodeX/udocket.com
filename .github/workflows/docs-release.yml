name: Docs Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VALE_VERSION: 3.7.1
      PUPPETEER_SKIP_DOWNLOAD: "1"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          check-latest: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh -s -- -y
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium pandoc
      - name: Install docs dependencies
        working-directory: packages/udocket_docs
        run: |
          uv sync --frozen --extra dev
          npm ci
      - name: Add local node binaries to PATH
        run: echo "$(pwd)/packages/udocket_docs/node_modules/.bin" >> $GITHUB_PATH
      - name: Build site
        working-directory: packages/udocket_docs
        run: uv run mkdocs build --config-file mkdocs.yml --site-dir site --clean
      - name: Render Mermaid (all)
        working-directory: packages/udocket_docs
        run: bash tools/render_mermaid.sh --all --verbose
      - name: Build PDFs (TDD & PRD)
        working-directory: packages/udocket_docs
        run: uv run python tools/pdf_build.py --skip-build
      - name: Checksums & manifest
        working-directory: packages/udocket_docs
        run: bash tools/hash_and_manifest.sh
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
      - name: Upload PDFs
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/udocket_docs/build/pdf/tdd.pdf
            packages/udocket_docs/build/pdf/manifest.json
