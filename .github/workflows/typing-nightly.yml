name: Typing Nightly

on:
  schedule:
    - cron: '0 5 * * *'  # daily at 05:00 UTC
  workflow_dispatch: {}

jobs:
  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/platform/requirements.txt
          pip install pyright mypy
      - name: Pyright stats
        id: stats
        run: |
          set -e
          echo "Running pyright --stats (packages + ops)"
          pyright --stats > pyright-stats.txt || true
      - name: Upload stats artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyright-stats
          path: pyright-stats.txt
      - name: Strict manifest checks
        run: |
          python scripts/typing/check_strict.py --tool both || true
