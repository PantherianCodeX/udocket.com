name: Typing Nightly

on:
  schedule:
    - cron: '0 5 * * *'  # daily at 05:00 UTC
  workflow_dispatch: {}

jobs:
  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r apps/platform/requirements.txt
          pip install pyright mypy
      - name: Pyright stats
        id: stats
        run: |
          set -euo pipefail
          printf '%s\n' "Running pyright --stats (packages + ops)" 
          pyright --stats > pyright-stats.txt || true
      - name: Upload stats artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyright-stats
          path: pyright-stats.txt
      - name: Strict manifest checks
        run: |
          set -euo pipefail
          python scripts/typing/check_strict.py --tool both || true
      - name: Typing audit manifest
        run: |
          set -euo pipefail
          python -m typing_inspector audit --max-depth 3
      - name: Upload typing audit manifest
        uses: actions/upload-artifact@v4
        with:
          name: typing-audit-manifest
          path: docs/typing/typing_audit_manifest.json

  typewiz-nightly:
    name: Typewiz Nightly Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r apps/platform/requirements.txt
          pip install pyright mypy || true
          pip install typewiz || echo "typewiz not on PyPI; ensure published or preinstalled"
      - name: Run typewiz audit
        run: |
          set -euo pipefail
          : "${GITHUB_STEP_SUMMARY:?GITHUB_STEP_SUMMARY must be set}"
          mkdir -p reports/typing
          if command -v typewiz >/dev/null 2>&1; then
            printf '%s\n' "Running Typewiz nightly" >> "$GITHUB_STEP_SUMMARY"
            typewiz audit --max-depth 3 --manifest reports/typing/typing_audit.json --summary expanded >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
            printf '%s\n' "Typewiz audit completed." >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "Building dashboards..." >> "$GITHUB_STEP_SUMMARY"
            typewiz dashboard --manifest reports/typing/typin
