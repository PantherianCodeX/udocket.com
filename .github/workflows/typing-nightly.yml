name: Typing Nightly

on:
  schedule:
    - cron: '0 5 * * *'  # daily at 05:00 UTC
  workflow_dispatch: {}

jobs:
  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/platform/requirements.txt -r apps/platform/requirements-dev.txt
      - name: Pyright stats
        id: stats
        run: |
          set -e
          echo "Running pyright --stats (packages + ops)"
          pyright --stats > pyright-stats.txt || true
      - name: Upload stats artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyright-stats
          path: pyright-stats.txt
      - name: Strict manifest checks
        run: |
          python scripts/typing/check_strict.py --tool both || true
      - name: Typing audit manifest
        run: |
          python -m typing_inspector audit --max-depth 3
      - name: Upload typing audit manifest
        uses: actions/upload-artifact@v4
        with:
          name: typing-audit-manifest
          path: docs/typing/typing_audit_manifest.json

  typewiz-nightly:
    name: Typewiz Nightly Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/platform/requirements.txt -r apps/platform/requirements-dev.txt || true
      - name: Run typewiz audit
        run: |
          mkdir -p reports/typing
          if command -v typewiz >/dev/null 2>&1; then
            typewiz audit --max-depth 3 --manifest reports/typing/typing_audit.json --summary expanded || true
            typewiz dashboard --manifest reports/typing/typing_audit.json --format markdown --output reports/typing/dashboard.md || true
            typewiz dashboard --manifest reports/typing/typing_audit.json --format html --output reports/typing/dashboard.html || true
            echo "Typewiz blocked folders (top 20):" >> $GITHUB_STEP_SUMMARY
            typewiz readiness --manifest reports/typing/typing_audit.json --level folder --status blocked --limit 20 >> $GITHUB_STEP_SUMMARY || true
            echo "\nTypewiz ready folders (top 20):" >> $GITHUB_STEP_SUMMARY
            typewiz readiness --manifest reports/typing/typing_audit.json --level folder --status ready --limit 20 >> $GITHUB_STEP_SUMMARY || true
          else
            echo "typewiz binary not found; skipping nightly audit" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload typewiz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typewiz-nightly-reports
          path: |
            reports/typing/typing_audit.json
            reports/typing/dashboard.md
            reports/typing/dashboard.html
