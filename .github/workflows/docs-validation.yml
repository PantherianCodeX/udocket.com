name: Docs Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  render-diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
      - name: Install Node deps
        run: npm ci
      - name: Add local node binaries to PATH
        run: echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH
      - name: Render Mermaid diagrams
        run: bash scripts/docs/render_mermaid.sh --all

  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
      - name: Install Node deps
        run: npm ci
      - name: Add local node binaries to PATH
        run: echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH
      - name: Install Vale CLI
        env:
          VALE_VERSION: 3.7.1
        run: |
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_Linux_64-bit.tar.gz" -o vale.tar.gz
          tar -xzf vale.tar.gz vale
          sudo mv vale /usr/local/bin/vale
          rm -f vale.tar.gz
      - name: Run documentation lint suite
        run: python scripts/docs/lint_docs.py
