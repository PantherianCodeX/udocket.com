error_codes:
  - code: POLICY_BLOCK
    http_status: 403
    audit_required: true
    description: "License, residency, or waiver policy prevented bundle publish or acknowledgment."
    client_action: "Surface waiver or licensing metadata, resolve policy issues, and rerun publish or adoption after remediation."
    related_metrics:
      - reference_api_error_total
      - reference_manager_publish_guard_failure
  - code: VALIDATION_ERROR
    http_status: 400
    audit_required: false
    description: "Bundle or template payload failed schema, checksum, or coverage validation."
    client_action: "Inspect the validation report, correct source data or manifests, and resubmit the publish job."
    related_metrics:
      - reference_api_error_total
  - code: CONFLICT
    http_status: 409
    audit_required: false
    description: "Publish request collided with an in-flight version where the bundle version already exists."
    client_action: "Refresh the bundle catalog, increment the semantic version, and retry once."
    related_metrics:
      - reference_api_error_total
  - code: PROVIDER_DEGRADED
    http_status: 503
    audit_required: true
    description: "Source connector offline or Reference Manager put into protective pause."
    client_action: "Alert Content Ops or Legal Ops, retry after the source recovers or manual upload completes."
    related_metrics:
      - reference_api_error_total
      - reference_manager_harvest_error_total
  - code: RATE_LIMIT
    http_status: 429
    audit_required: false
    description: "Org or system-wide publish cadence exceeded governance limits."
    client_action: "Respect Retry-After, reschedule batch publishes, or escalate for a temporary quota increase."
    related_metrics:
      - reference_api_error_total
      - reference_publish_rate_limit_total
