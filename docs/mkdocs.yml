site_name: uDocket Documentation
repo_url: https://github.com/PantherianCodeX/udocket.com

docs_dir: src

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed

plugins:
  - search
  - tags
  - redirects

nav:
  - Overview: index.md
  - TDD:
      - Overview: overview/tdd/index.md
      - Technical Design (High-Level): overview/tdd.md
      - Appendices:
          - Glossary: overview/tdd/appendices/glossary.md
          - Status Mapping: overview/tdd/appendices/status-mapping.md
          - Diagrams: overview/tdd/appendices/diagrams.md
  - PRD:
      - Overview: overview/prd/index.md
      - Product Requirements: overview/prd.md
  - Services:
      - Guardian: services/guardian.md
      - Settings Registry: services/settings.md
      - LPE: services/lp-engine.md
      - Reference Manager: services/ref-manager.md
  - Ops:
      - Runbooks: ops/runbooks/index.md
  - ADR:
      - Overview: adr/README.md
      - Guardian READY/QUARANTINED: adr/ADR-0001-guardian-ready-quarantine.md
      - API Versioning & Sunset: adr/ADR-0003-api-versioning-and-sunset.md
      - Localization & Policy Engine: adr/ADR-0004-localization-and-policy-engine.md
      - OPA Policy Plane: adr/ADR-0005-opa-policy-plane.md
