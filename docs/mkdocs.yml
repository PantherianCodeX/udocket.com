site_name: uDocket Documentation
repo_url: https://github.com/PantherianCodeX/udocket.com

docs_dir: src

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed

plugins:
  - search
  - tags
  - redirects

nav:
  - Overview: index.md
  - TDD:
      - Overview: tdd/index.md
      - Technical Design (High-Level): tdd/TDD.md
      - Appendices:
          - Glossary: tdd/appendices/glossary.md
          - Status Mapping: tdd/appendices/status-mapping.md
          - Diagrams: tdd/appendices/diagrams/
  - Services:
      - Guardian: services/guardian.md
      - Settings Registry: services/settings-registry.md
      - LPE: services/lpe.md
      - Reference Manager: services/reference-manager.md
  - Ops:
      - Runbooks: ops/runbooks/
  - ADR: adr/
