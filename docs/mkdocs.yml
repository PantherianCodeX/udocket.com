site_name: uDocket Documentation
repo_url: https://github.com/PantherianCodeX/udocket.com

docs_dir: src
use_directory_urls: false
exclude_docs: |
  **/_template.md

theme:
  name: material
  features:
  - navigation.sections
  - content.code.copy

markdown_extensions:
- admonition
- footnotes
- toc:
    permalink: true
- pymdownx.details
- pymdownx.highlight
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: pymdownx.superfences.fence_div_format
- pymdownx.tabbed
- attr_list

plugins:
- search
- tags
- redirects
- auto-image-scale:
    scale_attr: data-scale
    class_map:
      img--half: 0.5
    strict_missing: false
    default_scale: 0.7
- glightbox:
    width: 95vw
    height: 90vh
    zoomable: false
    draggable: false
    effect: none
    slide_effect: none

extra_css:
- assets/stylesheets/diagrams.css

extra_javascript:
- https://unpkg.com/mermaid@10/dist/mermaid.min.js
- js/mermaid-init.js
- assets/javascripts/vendor/panzoom.min.js
- assets/javascripts/glightbox-panzoom.js

nav:
- Overview: index.md
- Docs How To: CONTRIBUTING-docs.md
- TDD:
  - Overview: overview/tdd/index.md
  - Technical Design (High-Level): overview/tdd.md
  - Appendices:
    - Glossary: overview/tdd/appendices/glossary.md
    - Status Mapping: overview/tdd/appendices/status-mapping.md
    - API Error Codes Index: overview/tdd/appendices/api_error_codes.md
    - SLO Index: overview/tdd/appendices/slo_index.md
    - Diagrams: overview/tdd/appendices/diagrams.md
- PRD:
  - Overview: overview/prd/index.md
  - Product Requirements: overview/prd.md
- Apps:
  - Web App: apps/web-app.md
- Services:
  - Accounts & Tenants: services/accounts-tenants.md
  - Artifact Store: services/artifact-store.md
  - Audit & Evidence: services/audit.md
  - Billing & Subscriptions: services/billing-subscriptions.md
  - Communications: services/communications.md
  - Digital Signer: services/digital-signer.md
  - Guardian: services/guardian.md
  - Identity & Access: services/identity.md
  - LangGraph Agents: services/langgraph-agents.md
  - LLM Registry: services/llm-registry.md
  - LPE: services/lp-engine.md
  - Observability: services/observability.md
  - Platform Runtime: services/platform-runtime.md
  - Reference Manager: services/ref-manager.md
  - Settings Registry: services/settings.md
  - Search & Indexing: services/search-index.md
  - Worker Cluster: services/worker-cluster.md
- Ops:
  - Runbooks: ops/runbooks.md
- ADR:
  - Overview: adr/README.md
  - Guardian READY/QUARANTINED: adr/ADR-0001-guardian-ready-quarantine.md
  - API Versioning & Sunset: adr/ADR-0002-api-versioning-and-sunset.md
  - Localization & Policy Engine: adr/ADR-0003-localization-and-policy-engine.md
  - OPA Policy Plane: adr/ADR-0004-opa-policy-plane.md
