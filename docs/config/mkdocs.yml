site_name: uDocket Documentation
repo_url: https://github.com/PantherianCodeX/udocket.com

docs_dir: ../src
site_dir: ../site
use_directory_urls: false
exclude_docs: |
  **/_template.md

theme:
  name: material
  features:
  - navigation.sections
  - content.code.copy

markdown_extensions:
- admonition
- footnotes
- toc:
    permalink: true
- pymdownx.details
- pymdownx.highlight
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: pymdownx.superfences.fence_div_format
- pymdownx.tabbed
- attr_list

plugins:
- search
- tags
- redirects
- auto-image-scale:
    scale_attr: data-scale
    class_map:
      img--half: 0.5
    strict_missing: false
    default_scale: 0.7
- glightbox:
    width: 95vw
    height: 90vh
    zoomable: false
    draggable: false
    effect: none
    slide_effect: none

extra_css:
- _assets/stylesheets/diagrams.css

extra_javascript:
- https://unpkg.com/mermaid@10/dist/mermaid.min.js
- _assets/javascripts/mermaid-init.js
- _assets/javascripts/vendor/panzoom.min.js
- _assets/javascripts/glightbox-panzoom.js

nav:
- Home: index.md
- Contributor Guide: CONTRIBUTING-docs.md
- Product Strategy:
  - Overview: overview/prd/index.md
  - Product Requirements: overview/prd.md
- Architecture Blueprint:
  - Blueprint Overview: overview/tdd/index.md
  - High-Level Design: overview/tdd.md
- Architecture Appendices:
  - Glossary: overview/tdd/appendices/glossary.md
  - Status Mapping: overview/tdd/appendices/status-mapping.md
  - API Error Codes Index: overview/tdd/appendices/api_error_codes.md
  - SLO Index: overview/tdd/appendices/slo_index.md
  - Diagrams: overview/tdd/appendices/diagrams.md
- Experience:
  - Web App: experience/web-app.md
- Platform Control Plane:
  - Platform Runtime: platform/runtime.md
  - Settings Registry: platform/settings.md
  - Identity & Access: platform/identity.md
  - Guardian: platform/guardian.md
  - Observability: platform/observability.md
- Automation & Intelligence:
  - LangGraph Agents: automation/langgraph-agents.md
  - Worker Cluster: automation/worker-cluster.md
  - LLM Registry: automation/llm-registry.md
  - LPE: automation/lp-engine.md
- Data Platform:
  - Artifact Store: data/artifact-store.md
  - Digital Signer: data/digital-signer.md
  - Reference Manager: data/ref-manager.md
  - Search & Indexing: data/search-index.md
  - Audit & Evidence: data/audit.md
- Customer Operations:
  - Accounts & Tenants: customer/accounts-tenants.md
  - Billing & Subscriptions: customer/billing-subscriptions.md
  - Communications: customer/communications.md
- Operations Hub:
  - Runbooks: ops/runbooks.md
- Decision Records:
  - Overview: adr/README.md
  - Guardian READY/QUARANTINED: adr/ADR-0001-guardian-ready-quarantine.md
  - API Versioning & Sunset: adr/ADR-0002-api-versioning-and-sunset.md
  - Localization & Policy Engine: adr/ADR-0003-localization-and-policy-engine.md
  - OPA Policy Plane: adr/ADR-0004-opa-policy-plane.md
