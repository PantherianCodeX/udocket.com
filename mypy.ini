[mypy]
python_version = 3.11
plugins = mypy_django_plugin.main
ignore_missing_imports = True
strict_optional = False
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True

[mypy.plugins.django-stubs]
django_settings_module = apps.platform.config.settings.dev

# Tests and migrations are often dynamic
[mypy-apps.*.migrations.*]
ignore_errors = True

[mypy-tests.*]
ignore_errors = True

# Temporarily relax UI view typing until types are annotated incrementally
[mypy-apps.platform.ui.views]
ignore_errors = True

# Common third-party packages with dynamic typing
[mypy-rest_framework.*]
ignore_missing_imports = True

[mypy-django.*]
ignore_missing_imports = True
