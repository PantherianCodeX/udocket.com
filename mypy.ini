[mypy]
explicit_package_bases = True
mypy_path = typings
python_version = 3.12
pretty = True
plugins = mypy_django_plugin.main, mypy_drf_plugin.main
follow_imports = silent
ignore_missing_imports = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True
exclude = (?x)(^typings/|^scripts/|^packages/docs_tooling/src/doc_tools/|^packages/docs_tooling/tests/)

# Limit initial enforcement to core packages to avoid regressions.
# Use strict islands that grow over time per the typing plan.
files = packages, apps/platform/operations

# Stage 1 — Hygiene & low-risk wins (opt-in later by area)
; warn_unreachable = True
; implicit_reexport = False
; strict_equality = True

# Stage 2 — None/Optional safety
; no_implicit_optional = True

# Stage 3 — Function typing (ratchet by package)
check_untyped_defs = True

[mypy.plugins.django-stubs]
django_settings_module = apps.platform.config.settings.dev

# Tests and migrations are often dynamic
[mypy-apps.*.migrations.*]
ignore_errors = True

[mypy-tests.*]
ignore_errors = True

# Core packages: keep stronger checks
[mypy-packages.core.logging.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
warn_return_any = True

[mypy-packages.core.agents.common.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
warn_return_any = True

# Platform modules are being migrated; enforce at least typed defs in operations
[mypy-apps.platform.operations.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
warn_return_any = True
disallow_untyped_calls = True

[mypy-apps.platform.operations.services.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
warn_return_any = True

# Temporarily relax UI typing; will be tightened incrementally
[mypy-apps.platform.ui.*]
ignore_errors = True

# High-churn platform areas pending typing cleanup
[mypy-apps.platform.config.*]
ignore_errors = True

[mypy-apps.platform.authorization.*]
ignore_errors = True

[mypy-apps.platform.tenancy]
ignore_errors = True

[mypy-apps.platform.accounts.*]
ignore_errors = True

[mypy-apps.platform.jobs.*]
ignore_errors = True

[mypy-apps.platform.artifacts.*]
ignore_errors = True

[mypy-apps.platform.cases.*]
ignore_errors = True

[mypy-apps.platform.admin.*]
ignore_errors = True

[mypy-typings.simple_history.*]
ignore_errors = True

[mypy-simple_history.*]
ignore_errors = True

# Common third-party packages with dynamic typing
[mypy-rest_framework.*]
ignore_missing_imports = True

[mypy-django.*]
ignore_missing_imports = True
