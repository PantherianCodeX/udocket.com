[mypy]
explicit_package_bases = True
mypy_path = typings
python_version = 3.11
pretty = True
plugins = mypy_django_plugin.main, mypy_drf_plugin.main
follow_imports = silent
ignore_missing_imports = True            # silence 3rd-party libs until you’re ready
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True                  # enables targeted ignores:  # type: ignore[code]
exclude = (?x)(^typings/vendor/|^typings/external_stubs/|^scripts/)
; ; Stage 1 — Hygiene & low-risk wins - Turn on checks that catch dead/iffy code with little churn.
; warn_unreachable = True                # flags code after returns/raises
; implicit_reexport = False              # stray re-exports from imports become errors
; strict_equality = True                 # catches weird == / != comparisons
; ; Stage 2 — None/Optional safety (common real bugs) - Push on Nones and optionals.
; no_implicit_optional = True            # require Optional[X] instead of implicit None
; ; Stage 3 — Function typing (ratchet by package) - Now require typed APIs—gradually.
; check_untyped_defs = True              # type-check bodies even if defs untyped

; # Start here for the “cleanest” packages:
; [mypy-yourpkg.core.*]
; disallow_untyped_defs = True
; disallow_incomplete_defs = True        # all params must be typed, including self/cls

; # Everything else can keep just check_untyped_defs for now.

; ; Stage 4 — Any control (tighten the net) - Reduce silent Any creeping in.
; warn_return_any = True

; [mypy-yourpkg.core.*]
; disallow_any_generics = True           # e.g. List without type arg is an error
; disallow_untyped_calls = True          # cannot call from typed code into untyped
; disallow_untyped_decorated = True
; disallow_subclassing_any = True

; ; Stage 5 — Strict islands that grow - Adopt islands of strictness and expand them over time.
; # Keep repo-wide settings moderate, but enable strict where you’re ready:
; [mypy-yourpkg.utils.*]
; strict = True                          # bundle of strong checks; great for small, clean areas

[mypy.plugins.django-stubs]
django_settings_module = apps.platform.config.settings.dev

# Tests and migrations are often dynamic
[mypy-apps.*.migrations.*]
ignore_errors = True

[mypy-tests.*]
ignore_errors = True

# Core packages must compile under strict-ish checks.

[mypy-packages.udocket_core.logging.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
warn_return_any = True

[mypy-packages.udocket_core.agents.common.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
warn_return_any = True

# Platform modules are being migrated; enforce at least typed defs in operations
[mypy-apps.platform.operations.*]
disallow_untyped_defs = True
warn_return_any = True

[mypy-apps.platform.operations.services.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
warn_return_any = True

# Temporarily relax UI view typing until types are annotated incrementally
; Remove broad ignores; keep strict defaults and migrate incrementally.

# Common third-party packages with dynamic typing
[mypy-rest_framework.*]
ignore_missing_imports = True

[mypy-django.*]
ignore_missing_imports = True
