$schema: "http://json-schema.org/draft-07/schema#"
title: API Error Codes manifest
type: object
required:
  - error_codes
properties:
  error_codes:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - code
        - http_status
        - audit_required
        - description
        - client_action
      properties:
        code:
          type: string
        http_status:
          type: integer
          minimum: 100
          maximum: 599
        audit_required:
          type: boolean
        description:
          type: string
        client_action:
          type: string
        scenario:
          type: string
        related_metrics:
          type: array
          items:
            type: string
      additionalProperties: false
additionalProperties: false
