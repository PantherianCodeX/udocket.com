[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/**", "node_modules", "storage", "doc-builds"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # import sorting (isort)
    "W",  # pycodestyle warnings
]
ignore = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
