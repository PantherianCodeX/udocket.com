repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: uv-export-reqs
        name: export requirements via uv
        entry: python scripts/dev/export_requirements.py
        language: system
        pass_filenames: false
      - id: pyright-packages
        name: pyright (packages)
        entry: uv run --project apps/platform --extra dev pyright
        language: system
        pass_filenames: false
      - id: mypy-packages
        name: mypy (packages)
        entry: uv run --project apps/platform --extra dev mypy
        language: system
        pass_filenames: false
      - id: enforce-pyright-strict
        name: enforce pyright strict pragma
        entry: uv run --project apps/platform --extra dev python scripts/typing/ci_enforce_strict.py
        language: system
        pass_filenames: false
      - id: strict-manifest-check
        name: strict manifest check (focused)
        entry: uv run --project apps/platform --extra dev python scripts/typing/check_strict.py --tool both --stop-on-first
        language: system
        pass_filenames: false
      - id: docs-lint
        name: docs lint (src)
        entry: python scripts/docs/lint_docs.py
        language: system
        pass_filenames: false
