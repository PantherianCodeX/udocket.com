repos:
  - repo: local
    hooks:
      - id: pyright-packages
        name: pyright (packages)
        entry: pyright
        language: system
        pass_filenames: false
      - id: mypy-packages
        name: mypy (packages)
        entry: mypy
        language: system
        pass_filenames: false
      - id: enforce-pyright-strict
        name: enforce pyright strict pragma
        entry: python scripts/typing/ci_enforce_strict.py
        language: system
        pass_filenames: false
      - id: strict-manifest-check
        name: strict manifest check (focused)
        entry: python scripts/typing/check_strict.py --tool both --stop-on-first
        language: system
        pass_filenames: false
      - id: docs-lint
        name: docs lint (src)
        entry: python scripts/docs/lint_docs.py
        language: system
        pass_filenames: false

