services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file: .env
    volumes:
      - ./storage:/app/storage
      - ./.env:/app/.env:ro
    ports:
      - "${API_PORT:-8080}:8080"

  admin:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.admin
    env_file: .env
    volumes:
      - ./storage:/app/storage
      - ./.env:/app/.env:ro
    ports:
      - "${ADMIN_PORT:-8081}:8081"
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    env_file: .env
    volumes:
      - ./storage:/app/storage
      - ./.env:/app/.env:ro
    depends_on:
      - api

  # New Django ASGI platform (UI + API + Channels)
  platform:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.platform
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: apps.platform.config.settings.prod
      STORAGE_ROOT: /app/storage
      DATABASE_URL: sqlite:////app/storage/udocket_django.db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: django-db
    volumes:
      - ./storage:/app/storage
      - ./.env:/app/.env:ro
    ports:
      - "8000:8000"
    depends_on:
      - redis

  platform_worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.platform
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: apps.platform.config.settings.prod
      STORAGE_ROOT: /app/storage
      DATABASE_URL: sqlite:////app/storage/udocket_django.db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: django-db
    command: sh -lc "python -c 'import time; time.sleep(2)' && celery -A apps.platform.config.celery worker -l info"
    volumes:
      - ./storage:/app/storage
      - ./.env:/app/.env:ro
    depends_on:
      - redis

  platform_beat:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.platform
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: apps.platform.config.settings.prod
      STORAGE_ROOT: /app/storage
      DATABASE_URL: sqlite:////app/storage/udocket_django.db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: django-db
    command: sh -lc "python -c 'import time; time.sleep(2)' && celery -A apps.platform.config.celery beat -l info"
    volumes:
      - ./storage:/app/storage
      - ./.env:/app/.env:ro
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres-keycloak:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpass
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    command: start-dev --import-realm
    env_file: .env
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-keycloak
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpass
      # Expose on 8085 and advertise browser-accessible hostname (localhost)
      KC_HTTP_PORT: 8085
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8085
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      ports:
        - "8085:8085"
    volumes:
      - ./infra/docker/keycloak/udocker-realm.json:/opt/keycloak/data/import/udocker-realm.json:ro
    depends_on:
      - postgres-keycloak
      - redis

volumes:
  keycloak-db-data:
    driver: local
