services:
  platform:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.platform
    image: udocket-platform:dev
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: apps.platform.config.settings.prod
      STORAGE_ROOT: /udocket/storage
      APP_ROOT: /udocket
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: django-db
      RUN_PLATFORM_MIGRATIONS: "1"
      RUN_PLATFORM_BOOTSTRAP: "1"
    working_dir: /udocket
    volumes:
      - platform-storage:/udocket/storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  platform_worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.platform
    image: udocket-platform:dev
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: apps.platform.config.settings.prod
      STORAGE_ROOT: /udocket/storage
      APP_ROOT: /udocket
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: django-db
      RUN_PLATFORM_MIGRATIONS: "0"
      RUN_PLATFORM_BOOTSTRAP: "0"
    command: >-
      sh -c "python -c 'import time; time.sleep(2)' &&
      celery -A apps.platform.config.celery worker -l ${CELERY_LOG_LEVEL:-info} --events"
    working_dir: /udocket
    volumes:
      - platform-storage:/udocket/storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  platform_beat:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.platform
    image: udocket-platform:dev
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: apps.platform.config.settings.prod
      STORAGE_ROOT: /udocket/storage
      APP_ROOT: /udocket
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: django-db
      RUN_PLATFORM_MIGRATIONS: "0"
      RUN_PLATFORM_BOOTSTRAP: "0"
    command: >-
      sh -c "python -c 'import time; time.sleep(2)' &&
      celery -A apps.platform.config.celery beat -l ${CELERY_LOG_LEVEL:-info}"
    working_dir: /udocket
    volumes:
      - platform-storage:/udocket/storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-udocket}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platformpass}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  postgres-keycloak:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data

  keycloak:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.keycloak
    command: start-dev --import-realm --http-port=8085
    env_file: .env
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-keycloak
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpass
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8085
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    depends_on:
      postgres-keycloak:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  platform-storage:
    driver: local
  keycloak-db-data:
    driver: local
  postgres-data:
    driver: local
