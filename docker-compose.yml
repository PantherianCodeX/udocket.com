x-develop:
  platform-watch: &platform-watch
    watch:
      - action: sync
        path: apps/platform
        target: /app/apps/platform
      - action: sync
        path: packages
        target: /app/packages
      - action: rebuild
        path: apps/platform/pyproject.toml
      - action: rebuild
        path: apps/platform/uv.lock
      - action: rebuild
        path: infra/docker/Dockerfile.platform

services:
  # New Django ASGI platform (UI + API + Channels)
  platform:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.platform
    image: udocket-platform:dev
    develop: *platform-watch
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: apps.platform.config.settings.prod
      STORAGE_ROOT: /app/storage
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: django-db
      RUN_PLATFORM_MIGRATIONS: "1"
      RUN_PLATFORM_BOOTSTRAP: "1"
    volumes:
      - ./storage:/app/storage
      - ./.env:/app/.env:ro
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  platform_worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.platform
    image: udocket-platform:dev
    develop: *platform-watch
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: apps.platform.config.settings.prod
      STORAGE_ROOT: /app/storage
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: django-db
      RUN_PLATFORM_MIGRATIONS: "0"
      RUN_PLATFORM_BOOTSTRAP: "0"
    command: >-
      sh -lc "python -c 'import time; time.sleep(2)' &&
      celery -A apps.platform.config.celery worker -l ${CELERY_LOG_LEVEL:-info} --events"
    volumes:
      - ./storage:/app/storage
      - ./.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy


  platform_beat:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.platform
    image: udocket-platform:dev
    develop: *platform-watch
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: apps.platform.config.settings.prod
      STORAGE_ROOT: /app/storage
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: django-db
      RUN_PLATFORM_MIGRATIONS: "0"
      RUN_PLATFORM_BOOTSTRAP: "0"
    command: sh -lc "python -c 'import time; time.sleep(2)' && celery -A apps.platform.config.celery beat -l ${CELERY_LOG_LEVEL:-info}"
    volumes:
      - ./storage:/app/storage
      - ./.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  docs:
    build:
      context: packages/udocket_docs
      dockerfile: Dockerfile
    image: udocket-docs-toolbox:dev
    volumes:
      - .:/workspace:cached
    tty: true
    command: sleep infinity
    environment:
      PUPPETEER_SKIP_DOWNLOAD: "1"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    ports:
      - "8010:8010"
    profiles:
      - docs


  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-udocket}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platformpass}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  postgres-keycloak:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  keycloak:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.keycloak
    command: start-dev --import-realm --http-port=8085
    env_file: .env
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-keycloak
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpass
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8085
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8085:8085"
    depends_on:
      postgres-keycloak:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  keycloak-db-data:
    driver: local
  postgres-data:
    driver: local
