services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file: .env
    volumes:
      - ./storage:/app/storage
      - ./.env:/app/.env:ro
    ports:
      - "${API_PORT:-8080}:8080"

  admin:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.admin
    env_file: .env
    volumes:
      - ./storage:/app/storage
      - ./.env:/app/.env:ro
    ports:
      - "${ADMIN_PORT:-8081}:8081"
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    env_file: .env
    volumes:
      - ./storage:/app/storage
      - ./.env:/app/.env:ro
    depends_on:
      - api

  # New Django ASGI platform (UI + API + Channels)
  platform:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.platform
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: apps.platform.config.settings.prod
      STORAGE_ROOT: /app/storage
      DATABASE_URL: sqlite:////app/storage/udocket_django.db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: django-db
    volumes:
      - ./storage:/app/storage
      - ./.env:/app/.env:ro
    ports:
      - "8000:8000"
    depends_on:
      - redis

  platform_worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.platform
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: apps.platform.config.settings.prod
      STORAGE_ROOT: /app/storage
      DATABASE_URL: sqlite:////app/storage/udocket_django.db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: django-db
    command: sh -lc "python -c 'import time; time.sleep(2)' && celery -A apps.platform.config.celery worker -l info"
    volumes:
      - ./storage:/app/storage
      - ./.env:/app/.env:ro
    depends_on:
      - redis

  platform_beat:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.platform
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: apps.platform.config.settings.prod
      STORAGE_ROOT: /app/storage
      DATABASE_URL: sqlite:////app/storage/udocket_django.db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: django-db
    command: sh -lc "python -c 'import time; time.sleep(2)' && celery -A apps.platform.config.celery beat -l info"
    volumes:
      - ./storage:/app/storage
      - ./.env:/app/.env:ro
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    command: start-dev --import-realm
    env_file: .env
    environment:
      KC_DB: dev-file
      KC_HTTP_PORT: 8085
    ports:
      - "8085:8085"
    volumes:
      - ./infra/docker/keycloak/udocker-realm.json:/opt/keycloak/data/import/udocker-realm.json:ro
    depends_on:
      - redis
