extends: "spectral:oas"
rules:
  x-schemas-$id-present:
    description: Components derived from shared schemas must reference canonical $id.
    message: "Shared schema components should originate from spec/schemas with a canonical $id."
    given: "$.components.schemas[*]"
    severity: warn
    then:
      field: "$id"
      function: truthy
  x-schemas-no-additional-props:
    description: Shared components should not allow unspecified properties.
    message: "additionalProperties should be false for shared components unless justified."
    given: "$.components.schemas[*]"
    severity: warn
    then:
      field: additionalProperties
      function: defined
