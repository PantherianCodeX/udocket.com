[build-system]
requires = ["setuptools>=69","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "udocket-common"
version = "0.1.0"
description = "Shared helpers for uDocket services"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
readme = "README.md"
dependencies = [
    "jinja2>=3.1.0,<4",
    "pydantic>=2.12.4,<3",
    "PyYAML>=6.0.0,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9",
    "pytest-cov>=4.1.0,<5",
    "pytest-xdist>=3.6.1,<4",
    "ruff",
    "mypy",
    "pyright",
]
