[build-system]
requires = ["setuptools>=69","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "udocket-common"
version = "0.1.0"
description = "Shared helpers for uDocket services"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
readme = "README.md"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9",
]
