[mypy]
# Scope the run to this package so strict checks stay localized.
python_version = 3.12
explicit_package_bases = True
mypy_path = ../..:stubs

# Enable every strictness toggle MyPy exposes for library code.
strict = True
warn_unused_configs = True
warn_unreachable = True
warn_return_any = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
implicit_reexport = False
allow_redefinition = False
disallow_any_decorated = True
disallow_any_explicit = True
disallow_any_generics = True
disallow_any_unimported = True
disallow_incomplete_defs = True
disallow_subclassing_any = True
strict_equality = True
show_error_codes = True

# No mypy plugins enabled; packages/ai stays framework-agnostic.

[mypy-packages.common.*]
ignore_errors = True

[mypy-packages.core.*]
ignore_errors = True

[mypy-config.*]
ignore_errors = True
