[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "udocket-core"
version = "0.1.0"
description = "Core agent implementations and utilities for uDocket."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = [
    "azure-cognitiveservices-speech>=1.46.0,<2",
    "docxtpl>=0.20.1,<0.21",
    "langgraph>=0.6.10,<0.7",
    "Pillow>=12.0.0,<13",
    "requests>=2.32.5,<3",
    "typing-extensions>=4.15.0,<5",
    "urllib3>=2.5.0,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pyright",
    "types-requests",
]
